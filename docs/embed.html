t":"타운홀미팅에 참여할 부산시민을 찾습니다 이번엔 부산입니다. 대통령과 함께 토론할 200명의 부산시민을 모십니다. 북극항로 시대 준비를 위한 해수부 이전부터 지역 발전을 위한 다양한 정책 제안까지, 저마다 자유롭게 토론하며 합리적 대안을 만들어 가겠습니다. 여러분께서 보여주실 참여의 열기만큼 ‘국민이 주인인 나라’가 성큼 앞당겨질 것으로 믿습니다. ☑️ 날짜"},{"x":1.594,"y":0.309,"c":3,"m":"2025-07","d":"2025-07-17","f":4616,"i":"1945810247400182219","t":"오늘 에르도안 튀르키예 대통령과 처음으로 통화를 나누게 되어 매우 기쁘게 생각합니다. 튀르키예는 한국전쟁 당시 네 번째로 많은 군대를 파병해 우리를 도왔으며, 이후 지금까지 형제 국가로서 함께해 왔습니다. 에르도안 대통령과 함께 이러한 역사적 인연을 바탕으로 양국 간 전략적 동반자 관계를 한층 더 깊이 발전시켜 나갈 것을 재확인했습니다. 아울러 국방 및 방"},{"x":-0.166,"y":0.752,"c":0,"m":"2025-07","d":"2025-07-23","f":8510,"i":"1947884773235691594","t":"오래 기다리셨습니다! 대통령실 공식 디지털 굿즈, 오늘 국민 여러분께 ‘최초 공개’합니다. 국민의 소중한 의견을 반영해 제작한 첫 디지털 굿즈인 만큼, '보다 많은 분들께서, 보다 편리하게 활용할 수 있느냐'가 가장 중요한 기준이었습니다. 그렇기에 스마트워치는 물론 스마트폰에서 사용 가능하도록 폭넓게 준비했습니다. ‘국민주권정부’라는 이름에 걸맞게 디지털 "},{"x":-0.428,"y":-0.785,"c":6,"m":"2025-07","d":"2025-07-23","f":3029,"i":"1947897968537096701","t":"김경수 지방시대위원장, 구윤철 부총리 겸 기획재정부 장관, 배경훈 과학기술정보통신부 장관, 조현 외교부 장관, 정성호 법무부 장관, 윤호중 행정안전부 장관, 정은경 보건복지부 장관, 김성환 환경부 장관, 김영훈 고용노동부 장관. '유능한 민생정부'로 나아가는 길에 함께해 주실 분들입니다. 국민의 삶 전반을 책임지는 막중한 역할을 맡으신 만큼, 사명감을 가지"},{"x":1.454,"y":-0.626,"c":4,"m":"2025-07","d":"2025-07-23","f":2665,"i":"1947972472869114084","t":"토카예프 카자흐스탄 대통령과 처음으로 통화를 나눴습니다. 카자흐스탄은 중앙아시아 지역 내 우리의 최대 교역대상국이자 최대 투자대상국입니다. 1937년 러시아에서 중앙아시아로 이주한 우리 고려인 동포들을 처음 맞이해준 곳이기도 합니다. 먼저, 우리 독립운동의 영웅 홍범도 장군의 유해가 조국의 품으로 돌아올 수 있도록 적극 지원해 주신 것에 감사를 전했습니다."},{"x":1.562,"y":0.751,"c":3,"m":"2025-07","d":"2025-07-23","f":2957,"i":"1947973730375971311","t":"울프 크리스터손 스웨덴 총리와 처음으로 전화 통화를 하게 되어 기쁘게 생각합니다. 스웨덴은 한국전쟁 당시 의료지원단을 파견한 이래 소중한 우방으로 함께해왔으며, 오늘날에도 중립국감독위원회(NNSC)의 일원으로서 한반도 평화와 안정에 기여하고 있습니다. 앞으로도 경제, 국방 및 방위산업, 문화 등 다양한 분야에 걸쳐 함께 협력하며 우호 관계를 지속적으로 강화"},{"x":0.477,"y":1.993,"c":7,"m":"2025-07","d":"2025-07-24","f":5135,"i":"1948323768100900895","t":"부산대학교 전기공학과 학생들이 국제 인공지능 로봇대회 '로보컵 2025' 홈서비스 부문에서 1위를 차지하며 역대 최고점 기록까지 달성하는 쾌거를 이루었습니다. 37개국 1,500여 명의 참가자와 2,000대 이상의 로봇이 겨룬 치열한 경쟁 가운데 우리 학생들이 세계 최고 수준의 기술력과 혁신성을 인정받은 것에 큰 자부심을 느낍니다. 진심으로 축하합니다. 대"},{"x":1.396,"y":0.335,"c":3,"m":"2025-07","d":"2025-07-24","f":3239,"i":"1948351436364165191","t":"오늘 메르츠 총리와 처음으로 전화 통화를 나누게 되어 매우 기쁘게 생각합니다. 독일은 우리에게 특별한 나라입니다. 전쟁의 폐허를 딛고 눈부신 경제 발전을 이룩한 경험과 민족 간 분단이라는 아픈 역사를 함께 공유하기 때문입니다. 또한 1960~70년대에 한국 광부와 간호사가 독일로 파견되어 양국 경제 발전에 기여했으며, 이로 인해 두 나라의 국민들 간 소중한"},{"x":1.457,"y":-0.373,"c":3,"m":"2025-07","d":"2025-07-24","f":2767,"i":"1948352717644239202","t":"미르지요예프 우즈베키스탄 대통령과 통화를 나누게 되어 매우 기쁘게 생각합니다. 우즈베키스탄은 고려인들이 가장 많이 거주하는 나라로서, 정서와 문화 면에서 우리나라와 많은 공통점을 지니고 있습니다. 또한 우리 문화에 대한 높은 호감도로 인해 중앙아시아 내 한류 확산의 중심지 역할을 하고 있는 특별한 인연의 국가입니다. 이처럼 각별하고 오랜 우호협력의 역사 위"},{"x":-1.528,"y":-0.01,"c":8,"m":"2025-07","d":"2025-07-27","f":6482,"i":"1949401209078722982","t":"연 이자율 60% 이상은 이자+원금까지 전부 무효(20% 넘으면 초과이자 무효) '살기 위해 빌린 돈'이 '삶 옥죄는 족쇄' 되는 일 막겠습니다."},{"x":-0.415,"y":-0.789,"c":6,"m":"2025-07","d":"2025-07-28","f":3898,"i":"1949705723744772393","t":"정동영 통일부 장관, 안규백 국방부 장관, 전재수 해양수산부 장관, 한성숙 중소벤처기업부 장관, 임광현 국세청장님께 임명장을 수여했습니다. 그동안 쌓아온 역량과 전문성을 바탕으로 국민의 믿음에 부응하는 성과를 내주시길 당부드렸습니다. '유능한 민생정부'로 나아가는 길에 큰 역할 해주시리라 기대합니다. 함께할 수 있어 든든합니다."},{"x":-0.435,"y":-1.396,"c":6,"m":"2025-07","d":"2025-07-28","f":4297,"i":"1949757109715034471","t":"김상환 헌법재판소장님, 오영준 헌법재판관님께 임명장을 수여했습니다. 진심으로 축하합니다. 우리 사회 법치주의와 정의를 굳건히 세우는 최후 보루의 역할을 충실히 수행해 주시길, 어떠한 상황에도 흔들림 없이 헌법 정신을 구현하는 진정한 사법 리더가 되어 주시길 기대합니다."},{"x":0.025,"y":2.199,"c":7,"m":"2025-07","d":"2025-07-30","f":3614,"i":"1950496604584350177","t":"제3차 비상경제점검TF회의를 개최해 기존 법령의 틀을 넘어, 보다 넓고 과감하게 새로운 정책을 기획·정비해 줄 것을 전 부처에 지시했습니다. 또한 성과가 미흡하거나 관행적으로 지출되어 온 예산은 조정하고, 신선한 아이디어를 적극 발굴해 내년 예산안에 신속히 반영해달라 주문했습니다. 오늘 논의한 내용을 토대로 경제성장전략은 8월 중, 2026년 재정운용 방향"},{"x":1.604,"y":-0.403,"c":3,"m":"2025-07","d":"2025-07-30","f":2858,"i":"1950511897490727270","t":"일한의원연맹 회장 자격으로 방한한 스가 요시히데 전 일본 총리를 만나뵈었습니다. 가장 먼저, 한일관계 발전을 위해 국회 구성원들 간 교류가 매우 중요한 역할을 한다고 전했습니다. 스가 전 총리는 새 정부 출범을 축하하며, 앞으로 한일 관계가 미래지향적으로 발전할 수 있도록 일본 국회도 적극 지원하겠다고 밝혔습니다. 아울러 국교 정상화 60주년을 맞아 한일관"},{"x":1.698,"y":0.826,"c":3,"m":"2025-08","d":"2025-08-08","f":4464,"i":"1953802865262440863","t":"8월 8일 오늘은 대한민국과 싱가포르가 수교를 맺은지 50주년이 되는 뜻깊은 날입니다. 오늘을 기념하며 타르만 샨무가라트남 싱가포르 대통령과 축하 서한을 교환하고, 1975년 외교 관계 수립 이후 지난 반 세기 동안 양국이 이루어낸 눈부신 발전을 함께 축하했습니다. 올해 양국 관계 격상을 통해 앞으로도 두 나라의 우호 협력 관계를 더욱 강화하고, 향후 10"},{"x":1.061,"y":0.593,"c":3,"m":"2025-08","d":"2025-08-11","f":2880,"i":"1954876722215846387","t":"제리 필레이 세계교회협의회(WCC) 총무와 한국기독교교회협의회(NCCK) 대표단을 만나, 한국 교회의 연대의 역사를 돌아보고 앞으로의 교류·협력 방향을 논의했습니다. 가장 먼저, 김대중 대통령의 인권 침해 실태를 세계에 알리고 민주주의 발전과 한반도 평화를 위해 힘써준 WCC에 감사를 표하며, 과거 남북 교회 대화를 주선했던 WCC가 또다시 새로운 소통의 "},{"x":1.539,"y":0.478,"c":3,"m":"2025-08","d":"2025-08-11","f":2910,"i":"1954878028536057900","t":"딕 스코프 네덜란드 총리와 처음으로 전화 통화를 나눌 수 있어 기쁘게 생각합니다. 네덜란드는 1961년 공식 수교 이전부터 한국전쟁 당시 5천 명 이상의 병력을 파병하며 큰 도움을 주었습니다. 수교 이후 양국은 우호협력관계를 꾸준히 발전시켜 왔으며, 오늘날에는 전략적 동반자이자 반도체 동맹으로서 관계를 더욱 강화하고 있습니다. 앞으로도 무역·투자, 인공지능"},{"x":0.21,"y":-1.309,"c":0,"m":"2025-08","d":"2025-08-12","f":11694,"i":"1955117042287477201","t":"2025년 제2회 초중고졸업학력 검정고시에 도전하는 수험생 여러분께 뜨거운 응원을 전합니다. 누군가는 긴 세월 품었던 배움의 꿈을 이어가고자, 또 누군가는 새로운 도전을 향해 용기 있게 나아가고자 이 자리까지 오셨겠지요. 각자의 사정과 환경은 다르지만, 포기하지 않고 꿋꿋이 걸어온 여러분 모두가 자랑스럽습니다. 남들과 비교할 필요 없습니다. 바쁜 일상 속에"},{"x":-0.413,"y":-0.75,"c":7,"m":"2025-08","d":"2025-08-12","f":3242,"i":"1955197713093627973","t":"권오을 국가보훈부 장관, 최휘영 문화체육관광부 장관, 김정관 산업통상자원부 장관, 김윤덕 국토교통부 장관께 임명장을 수여했습니다. 오랜 기간 각 분야에서 쌓아온 전문성과 풍부한 경험을 바탕으로 국민의 삶과 직결된 실질적 변화를 만들어 내고, 시대가 요구하는 혁신을 힘 있게 추진해 주시리라 기대합니다. 네 분 장관님과 함께 힘을 모아 대한민국이 더 풍요롭고 "},{"x":1.349,"y":-0.205,"c":7,"m":"2025-08","d":"2025-08-13","f":3076,"i":"1955623920855650596","t":"모하메드 빈 살만 사우디아라비아 왕세자 겸 총리와 취임 후 첫 통화를 나눴습니다. 「사우디 비전 2030」을 주도하며 사우디의 개혁과 발전을 이끌고 계신 왕세자와의 대화를 통해, 대한민국의 새로운 성장 비전과 전략을 구현해 나가는 데 있어 깊은 통찰과 영감을 얻을 수 있었습니다. 양국은 1970년대 한국 기업의 사우디 건설 사업 진출을 시작으로 상호 호혜적"},{"x":1.701,"y":0.553,"c":3,"m":"2025-08","d":"2025-08-14","f":3225,"i":"1955971768210088343","t":"오늘 페르디난드 로무알데즈 마르코스 주니어 필리핀 대통령과 취임 후 첫 통화를 나눴습니다. 필리핀은 아시아 국가 중 최초이자 최대 규모로 한국전쟁에 참전한 오랜 우방국입니다. 우리나라가 현재 필리핀의 최대 투자국이 된 점에 주목하며, 해상 교량과 철도 등 인프라,  창을 넓혀준 게이츠 이사장은 최근 글로벌 보건과 지속가능한 에너지 등 인류를 위한 공공재 창출에 앞장서고 있습니다. 우리 정부와 국내 의료·바이오 기업들은 백신 개발을 비롯한 글로벌 보건 분야에서 게이츠 재단과 함께 눈에 띄는 성과를 거두고 있습니"},{"x":1.071,"y":-0.987,"c":4,"m":"2025-08","d":"2025-08-23","f":6290,"i":"1959255576569151715","t":"대한민국 대통령이 임기 첫 해외 순방지로 일본을 찾은 것은 이번이 처음입니다. 특히 2025년은 광복 80주년과 한일 국교 정상화 60주년이 겹치는 뜻깊은 해이기에 더욱 큰 상징성을 갖습니다. 먼 이국땅에서 굳건히 정체성을 지켜오신 재일 동포 여러분께 대한민국을 대표해 감사를 전했습니다. 조국의 아픔과 굴곡, 성장의 길을 함께 걸어온 재일 동포 여러분이 바"},{"x":1.298,"y":-0.84,"c":4,"m":"2025-08","d":"2025-08-26","f":6447,"i":"1960164166083445129","t":"120년이 넘는 세월 동안 미국 땅에서 새로운 역사를 일궈오신 재미 동포 여러분을 만나 뵙게 되어 영광입니다. 수많은 역경을 기회로 바꾸며 한미 양국의 든든한 가교가 되어주신 모든 동포 여러분께 깊은 경의를 표합니다. 최근 선출된 앤디 김 상원의원을 비롯한 우리 동포들이 미국 사회 각계에서 리더십을 발휘하며 대한민국의 위상을 높이고 있습니다. 한식과 K-팝"},{"x":-0.166,"y":2.166,"c":2,"m":"2025-08","d":"2025-08-27","f":3108,"i":"1960519395182305471","t":"골목상권이 살아야 경제가 삽니다"},{"x":0.159,"y":-0.44,"c":4,"m":"2025-08","d":"2025-08-27","f":3086,"i":"1960569690402775155","t":"남북전쟁, 1·2차 세계대전, 한국전쟁, 베트남전쟁 등 전몰장병들이 존엄하게 안장되어 있는 알링턴 국립묘지를 찾았습니다. 오늘의 평화와 민주주의, 그리고 한미 양국 간의 굳건한 우정은 이곳에 잠든 이들의 헌신이 있어 가능했습니다. 자유와 평화를 위해 목숨을 바친 모든 영령과, 이름조차 남기지 못한 무명용사들의 숭고한 희생을 기리며 다시 한번 깊은 경의와 애"},{"x":1.164,"y":-0.967,"c":4,"m":"2025-08","d":"2025-08-27","f":5032,"i":"1960569741149659388","t":"서재필 박사는 우리나라 최초의 민간 신문 ‘독립신문’을 창간하고, 독립협회 조직과 독립문 건립 등 다양한 애국계몽운동을 전개한 분입니다. 외세와 수구세력의 탄압으로 미국으로 추방된 이후에도 3·1운동 소식이 전해지자 의사로서의 삶을 접고 조국의 독립을 위해 다시 국제무대의 외교 현장에 뛰어들었습니다. 이번 미국 방문에서 서재필 박사의 헌신과 자주독립 정신이"},{"x":-0.811,"y":-1.013,"c":0,"m":"2025-08","d":"2025-08-28","f":4763,"i":"1960930947685285915","t":"날카로운 직감과 관찰력으로 보이스피싱 범죄에 신속히 대처한 이진웅 경사님을 칭찬합니다. 투철한 사명감이 사회에 얼마나 긍정적인 영향을 미치는지를 여실히 보여주었습니다. 이같은 헌신으로 우리가 평화로운 일상을 누릴 수 있음에 깊은 감사를 전합니다."},{"x":1.483,"y":-0.359,"c":3,"m":"2025-08","d":"2025-08-28","f":3074,"i":"1961036406601707550","t":"자파로프 키르기스스탄 대통령과 취임 후 첫 통화를 가졌습니다. 최근 양국 간 교역과 인적 교류가 활발히 늘어나고 있는 점을 높이 평가하며 핵심 광물, 재생에너지 분야 등 협력을 넓히고 '포괄적 동반자 관계'를 한층 강화해 나가기로 뜻을 모았습니다. 실용주의를 중시하는 자파로프 대통령님의 의견에 많은 부분 공감했습니다. 앞으로도 양국 관계의 상호 호혜적 발전"},{"x":1.439,"y":-0.506,"c":4,"m":"2025-08","d":"2025-08-28","f":2601,"i":"1961037503944925345","t":"라흐몬 타지키스탄 대통령과 첫 통화를 나눌 수 있어 기쁩니다. 타지키스탄은 1992년 수교 이후 함께 발전해온 나라로, 실크로드의 중심지이자 ‘세계의 지붕’으로 불리는 파미르 고원을 간직한 곳입니다. 혜초 스님이 신라 시절 순례 도중 소중한 기록을 남겼던 역사적 유산의 땅이기도 합니다. 양국은 지속적으로 호혜적 관계 발전을 도모하는 동시에, 내년 우리나라에"},{"x":1.447,"y":-0.285,"c":3,"m":"2025-08","d":"2025-08-29","f":3065,"i":"1961370018425581822","t":"베르디무하메도프 투르크메니스탄 대통령과 처음으로 통화를 나눴습니다. 투르크메니스탄은 세계 4위의 천연가스 매장량을 보유한 에너지 강국으로, 우리의 중요한 협력 파트너입니다. 지난 6월 이란에 체류하던 우리 국민들이 투르크메니스탄을 경유해 안전히 귀국할 수 있도록 적극 지원해 주기도 했습니다. 2008년 호혜적 동반자 관계 격상 이후 에너지와 플랜트 부문에서"},{"x":-0.122,"y":0.537,"c":6,"m":"2025-08","d":"2025-08-31","f":3770,"i":"1962093483214410099","t":"지난 13일, 국정기획위원회가 마련한 국정운영 5개년 계획(안)을 국민 여러분께 보고드린 바 있습니다. 정치, 경제, 사회, 외교 등 대한민국의 모든 분야를 재정비하고, 미래로 힘차게 도약하기 위한 이번 계획(안)은 앞으로 국민의 다양한 의견을 폭넓게 수렴해 더욱 완성도 높은 정책으로 발전시킬 예정입니다. 정책 수립 단계부터 집행에 이르는 모든 과정을 투명"},{"x":-0.368,"y":-1.631,"c":0,"m":"2025-09","d":"2025-09-02","f":5191,"i":"1962824127049539763","t":"천준호 의원님 보고싶네요^^ 저보다 더 저를 잘 표현해 주셨군요. 책 잘 봤습니다."},{"x":1.693,"y":0.91,"c":3,"m":"2025-09","d":"2025-09-02","f":2443,"i":"1962840647569903832","t":"방글라데시, 앙골라, 알제리, 파키스탄, 도미니카공화국, 스페인, 인도네시아 등 7개 국가의 신임 주한대사로부터 신임장을 제출받았습니다. 신임장 제정식은 파견국 국가원수가 자국 신임 대사에게 수여한 신임장을 주재국 국가원수에게 공식 전달하는 외교 의례입니다. 정부 출범 이후 처음 개최하는 터라 더욱 뜻깊습니다. 양국 관계가 다방면에서 더욱 견고해지도록 가교"},{"x":-0.864,"y":-0.32,"c":8,"m":"2025-09","d":"2025-09-02","f":3383,"i":"1962843207101980767","t":"대장 진급 및 보직 신고, 삼정검 수치 수여식을 개최해 진영승 합참의장 후보자, 김규하 육군참모총장, 강동길 해군참모총장, 손석락 공군참모총장, 김성민 연합사부사령관, 김호복 육군 2작전사령관, 주성운 육군 지상작전사령관 등 총 일곱 명의 장성 진급자를 축하했습니다. 정권이 아닌 국가에 충성하고, 개인이 아닌 직위의 책임을 다할 것을 강조하며, 특정 개인이"},{"x":0.253,"y":2.114,"c":7,"m":"2025-09","d":"2025-09-03","f":3023,"i":"1963233496694235482","t":"제62회 방송의 날을 축하합니다. 방송은 주파수를 매개로 우리와 세상을 연결하며, 일상을 더욱 풍요롭고 유익하게 만드는 매체입니다. 다양한 정보와 문화, 흥미로운 콘텐츠를 통해 우리의 삶에 활력을 불어넣고 있습니다. 방송3법 개정안이 최근 국회를 통과하며 방송의 공정성과 독립성 확보를 위한 제도적 기반이 마련되었습니다. 앞으로 이 토대 위에서 합리적인 의사"},{"x":-0.019,"y":-1.251,"c":0,"m":"2025-09","d":"2025-09-04","f":4035,"i":"1963404843227517376","t":"대통령도 미처 알지 못했던 경호관들의 하루.. 영상을 보니 우리 경호관님들의 헌신과 노고가 더욱 깊이 와닿습니다. 고생이 많으시지요. 늘 든든하게 생각합니다. 진심으로 고맙습니다^^"},{"x":-0.543,"y":1.345,"c":7,"m":"2025-09","d":"2025-09-04","f":3184,"i":"1963539079997657512","t":"노동계를 대표하는 양대 노총 위원장님들과 함께하는 시간을 가졌습니다. 가장 먼저, 산재 사망 사고를 획기적으로 줄일 방안에 대해 의견을 구하고, 주4.5일제 도입, 정년 연장, 5인 미만 사업장 근로기준법 적용 등 노동계의 현안도 경청했습니다. 이어 노동 선진 사회와 기업하기 좋은 나라가 충분히 양립할 수 있음을 강조하며, 갈등 해소와 신뢰 구축을 위해 노"},{"x":1.488,"y":-0.473,"c":3,"m":"2025-09","d":"2025-09-04","f":2771,"i":"1963577626163118591","t":"올해는 한-몽 수교 35주년을 맞이하는 뜻깊은 해로, 양국은 1990년 수교 이래 다양한 분야에서 협력을 발전시켜 왔습니다. 몽골은 역사적·문화적으로 우리와 밀접한 관계를 유지해 온 이웃이며, 여러 측면에서 깊은 정서적 유대감을 갖고 있습니다. 후렐수흐 대통령과 통화를 나누며, 책임감과 국익을 중시하는 국정철학에 공감했습니다. 또한 희소금속, 기후변화 대응"},{"x":0.304,"y":1.851,"c":7,"m":"2025-09","d":"2025-09-05","f":2589,"i":"1963909513674678300","t":"K-바이오 산업은 제약 강국들이 100년 이상 쌓아온 역량을 불과 몇십 년 만에 따라잡으며 우리 경제의 미래 성장 동력으로 주목받고 있습니다. 참 자랑스럽습니다. 뛰어난 연구 인력, 세계적 수준의 제조 기반, 국제적 신뢰도까지 대한민국이 '글로벌 바이오 강국'으로 도약할 수 있는 조건은 충분합니다. 정부는 바이오 산업이 자율적이고 창의적으로 운영될 수 있도"},{"x":0.329,"y":-1.306,"c":0,"m":"2025-09","d":"2025-09-06","f":4330,"i":"1964277836967022974","t":"영락보린원 원생 30여 명과 함께 영화 킹 오브 킹스(The King of Kings)를 관람했습니다. 입구에 들어서는 순간부터 아이들의 얼굴에는 호기심과 기대가 가득했습니다. 팝콘은 달콤한 맛이 좋은지 고소한 맛이 좋은지, 영화는 어떤 내용인지, 좋아하는 캐릭터는 무엇인지 들뜬 표정으로 서로 이야기를 나누는 모습이 무척이나 사랑스럽더군요. 오늘 이 만남이"},{"x":0.44,"y":1.78,"c":7,"m":"2025-09","d":"2025-09-08","f":2595,"i":"1964996423574819162","t":"인공지능은 기술 혁신의 차원을 넘어, 우리의 일상과 사회 전반을 근본적으로 변화시키고 있습니다. 국가 경쟁력의 핵심 동력일 뿐 아니라 국력, 경제력, 그리고 안보를 좌우하는 중요한 역량이기도 합니다. 이제 우리는 과감하게 미래를 선도해 나가야 합니다. 인공지능은 산업 구조의 혁신을 이끌고 삶의 질을 높여 대한민국을 새로운 번영의 시대로 이끌어 줄 것입니다."},{"x":-0.059,"y":1.05,"c":0,"m":"2025-09","d":"2025-09-09","f":2467,"i":"1965203527552413776","t":"‘강원의 마음을 듣다’ 타운홀미팅에 참여할 강원도민을 찾습니다 대통령과 함께 토론할 200명의 강원특별자치도민을 모십니다. K-문화관광벨트 개발과 글로벌 관광허브 구축, 그리고 지역 균형발전을 위한 혁신 정책까지 도민의 생생한 현장 목소리를 바탕으로 합리적이고 지속가능한 해법을 만들어 가겠습니다. 도민 여러분의 소중한 목소리에 귀 기울이며 대안을 모색하겠습"},{"x":-0.538,"y":0.171,"c":1,"m":"2025-09","d":"2025-09-10","f":3252,"i":"1965668809190281603","t":"노동관계법령이 현장에서 제대로 준수되는지 지도·감독·수사하는 근로감독관의 명함 뒷면에는 '떨어지면 죽습니다!'라는 경고 문구가 적혀있다고 합니다. 앞으로 노동부장관 명함에도 이 문구를 추가해 산업현장에서의 경각심을 고취하고자 합니다. 산재 사망 사고를 더 이상 용납하지 않겠다는 정부의 강력한 의지가 담겨있습니다. 산업현장에서 일어나는 사고는 결코 개인의 문"},{"x":-0.482,"y":0.163,"c":1,"m":"2025-09","d":"2025-09-11","f":4838,"i":"1965933004624376201","t":"인천 앞바다 갯벌에서 국민을 구조하던 경찰관이 실종됐다는 소식을 접했습니다. 구조 당국은 수색작업이 최대한 신속하게 이루어질 수 있도록 가용한 모든 인력과 장비를 총동원해 주시길 바랍니다. 아울러, 정부는 국민 생명과 안전을 지키기 위해 현장에서 사명감을 가지고 헌신하는 분들이 보다 안전하게 임무를 수행할 수 있도록 제도와 장비를 철저히 점검하고 보완하겠습"},{"x":1.555,"y":0.541,"c":3,"m":"2025-09","d":"2025-09-11","f":2308,"i":"1966142309088813082","t":"도날드 투스크 폴란드 총리와 취임 후 첫 통화를 가지게 되어 매우 뜻깊게 생각합니다. 가장 먼저 1989년 수교 이래 양국 관계가 정무, 경제, 인적 교류 등 제반 분야에서 발전해 온 것을 높이 평가하고 방산, 인프라, 교역, 투자 등 각종 분야에서 협력도 더욱 강화하기로 했습니다. 투스크 총리는 국제무대에서 주요 경제국인 양국이 협력할 사안이 많다며, 한"},{"x":1.364,"y":0.5,"c":3,"m":"2025-09","d":"2025-09-11","f":3105,"i":"1966142447425323287","t":"에마뉘엘 마크롱 프랑스 대통령과 처음으로 전화 통화를 나눴습니다. 프랑스는 UN 안보리 상임이사국이자 EU, G7, G20의 주요 회원국으로서, 우리의 한반도 정책을 흔들림 없이 지지해온 든든한 우방입니다. 한국전쟁 당시 3천4백여 명의 장병을 파병한 바도 있습니다. 양국은 1886년 수교 이래 꾸준히 우호협력관계를 발전시켜 왔으며, 내년에는 수교 140주"},{"x":-0.115,"y":1.753,"c":4,"m":"2025-09","d":"2025-09-12","f":3133,"i":"1966479080393765111","t":"우리나라 최고 관광지이자 청정 지역인 강원도는 안보라는 명목 아래 막대한 희생을 치르고 있습니다. 인구는 150만 명에 못 미치지만, 지역 내 성장 발전이 정체된 탓에 수도권으로 떠나는 이들은 나날이 늘고 있습니다. 접경 지역이라는 특수성이 삶을 제약하는 무게로 작용하는 것이 아니라 오히려 평화와 번영의 가능성을 열어가는 자산으로 바뀔 수 있도록 지속적으로"},{"x":-0.389,"y":-0.689,"c":6,"m":"2025-09","d":"2025-09-15","f":4117,"i":"1967541210265874752","t":"국민통합위원장, 국가건축정책위원장, 농어업·농어촌특별위원장, 교육부장관, 여성가족부장관, 국가교육위원장, 공정거래위원장, 금융위원장에게 임명장을 수여하며, 오늘부로 정부 1기 내각을 완성했습니다. 각자의 자리에서 맡은 바를 성실히 수행하며, 국민께 더 나은 내일과 희망찬 미래를 선사해 주시길 부탁드렸습니다. 국민의 삶과 직결된 실질적 변화를 실현하고, 시대"},{"x":-0.283,"y":1.298,"c":7,"m":"2025-09","d":"2025-09-16","f":2788,"i":"1967925490972279176","t":"‘청년들의 기회와 희망, K-농업에서 펼치다’를 주제로 청년농업인 간담회를 개최했습니다. 복숭아 수확 이후 이어지는 가지치기 작업에 함께하며, 현장의 생생한 이야기를 들을 수 있었습니다. 농지 내 화장실 m":"2025-10","d":"2025-10-15","f":2333,"i":"1978439802518433915","t":"‘세계 3위 게임강국으로 레벨업’이라는 주제로 게임업계 관계자분들과 함께 간담회를 가졌습니다. 탄력적 노동시간 운영, 산업 혁신, 규제 완화, 중소 게임사 지원 방안 등 현장의 다양한 목소리를 들을 수 있었습니다. 과거에는 부정적인 시각이 많았지만, 이제는 게임산업을 국부 창출과 일자리 창출의 핵심으로 재인식해야 할 때입니다. 창의력과 기술력을 바탕으로 한"},{"x":1.584,"y":0.813,"c":3,"m":"2025-10","d":"2025-10-15","f":3081,"i":"1978440178739143065","t":"한국을 찾은 빅토리아 스웨덴 왕세녀를 만나게 되어 매우 기쁘게 생각합니다. 스웨덴은 한국전쟁 당시 천여 명의 의료지원단을 파견하고 한반도 특사를 운영하는 등 한반도 평화에 꾸준히 기여해 온 소중한 우방입니다. 한반도 평화에 대한 스웨덴의 관심과 노력에 감사를 전했습니다. 유명가수 ABBA와 한강 작가의 노벨문학상 수상 덕에 스웨덴은 우리에게 더욱 친근히 느"},{"x":1.518,"y":-0.267,"c":3,"m":"2025-10","d":"2025-10-16","f":2691,"i":"1978792557741305898","t":"태국의 아누틴 총리와 처음으로 통화하게 되어 매우 기쁘게 생각합니다. 태국은 한국전쟁 당시 조기에 파병을 결정한 우방국으로, 오늘날 아세안과 APEC 등 다자무대에서 긴밀히 협력하고 있는 우리의 전략적 동반자입니다. 우리 국민에게 가장 사랑받는 관광지 중 하나이며, 다수의 K-pop 그룹에 태국 출신 멤버들이 활동하고 있어 더욱 친숙하게 느껴지는 나라이기도"},{"x":0.324,"y":1.753,"c":7,"m":"2025-10","d":"2025-10-20","f":2070,"i":"1980221447248470047","t":"K-방산이 여는 진정한 자주국방의 길! 방위산업은 첨단 기술 개발의 핵심 요소입니다. 민간의 첨단 기술 산업을 이끄는 주요 촉매로 방위산업이 역할을 다할 수 있도록, 정부의 지원과 역할을 더욱 확대해 나가겠습니다. 📎"},{"x":1.421,"y":-0.119,"c":3,"m":"2025-10","d":"2025-10-20","f":2219,"i":"1980262774388539437","t":"‘움므 알 둔야’, 즉 ‘인류 문명의 어머니’로 알려진 이집트는 대한민국의 ‘포괄적 협력 동반자’입니다. 아프리카·중동 지역에서 우리와 가장 핵심적인 관계를 맺고 있는 국가 중 하나라는 뜻이기도 합니다. 양국이 수교를 맺은지 어느덧 정확히 30년입니다. 그간 경제, 방위산업, 문화 교류 등 다방면에서 우호 협력을 발전시켜 왔습니다. 앞으로도 호혜 협력의 모"},{"x":-0.046,"y":1.116,"c":7,"m":"2025-10","d":"2025-10-21","f":2109,"i":"1980423792955703395","t":"‘대구의 마음을 듣다’ 타운홀미팅에 함께해 주십시오 '모두의 대통령'으로서 역할을 다하기 위해 가장 중요한 것은 국민 한 분 한 분의 목소리에 귀를 기울이는 일이라고 생각합니다. 국민 여러분과 직접 소통하기 위해 시작한 타운홀미팅, 다섯 번째 만남은 대구광역시에서 열립니다. 첨단기술 융합 메디시티 실현, AI로봇수도 조성, 미래모빌리티 산업 선도도시 구축,"},{"x":0.079,"y":2.111,"c":7,"m":"2025-10","d":"2025-10-21","f":3677,"i":"1980595508227035208","t":"코스피 3800, 진짜 성장은 지금부터!📈 어제 코스피 지수가 사상 최초 3,800선을 넘어서고 오늘도 사상 최고가를 갱신했습니다. 생산적 금융으로 전환 추세가 더 굳건히 뿌리내리려면 일관되고 실효성 있는 정책을 통해서 우리 사회 전체의 인식을 바꿔야 합니다. 합리적이고 지속 가능한 투자 문화가 정착되고, 이를 바탕으로 경제 산업과 국민 자산의 동반 성장이"},{"x":0.02,"y":0.294,"c":6,"m":"2025-10","d":"2025-10-25","f":2499,"i":"1981917070385405987","t":"대구에서 다시, 대한민국의 균형발전을 생각합니다. 지역이 살아야 나라가 삽니다. 현장에서 답을 찾고, 국민의 목소리를 정책으로 담겠습니다. 그것이야말로 국민주권의 실현이자 민주주의의 본질이라 믿습니다. #이재명 #대구 #균형발전"},{"x":1.769,"y":0.557,"c":3,"m":"2025-10","d":"2025-10-27","f":2107,"i":"1982597743291081168","t":"말레이시아에서 훈 마넷 캄보디아 총리와 아누틴 태국 총리의 리더십 아래 캄보디아와 태국 간 공동선언이 발표된 것을 진심으로 환영합니다. 이번 합의가 양국 관계를 넘어 지역의 평화와 안정 증진에 기여하기를 바랍니다. 아울러 역사적인 합의 도출을 위해 헌신한 도널드 트럼프 미국 대통령과 올해 아세안 정상회의 의장국인 말레이시아의 안와르 총리의 노력을 높이 평가"},{"x":0.935,"y":-0.781,"c":6,"m":"2025-10","d":"2025-10-27","f":3271,"i":"1982650226369609848","t":"대한민국은 전 세계가 주목하는 문화 강국이자 민주주의의 모범국가로 당당히 자리잡고 있습니다. 말레이시아 현지의 한류 열기를 보며 대한민국 국민으로서 큰 자부심을 느낍니다. 세계 어디에 있든 대한민국의 이름을 자신 있게 말할 수 있는, 우리 후손들이 자랑스러워 할 진정한 대한민국을 반드시 만들겠습니다. 먼 이국 땅 말레이시아에서 대한민국의 위상을 높이고 계신"},{"x":1.709,"y":0.473,"c":3,"m":"2025-10","d":"2025-10-27","f":2029,"i":"1982815894297522371","t":"훈 마넷 캄보디아 총리와의 첫 정상회담에서 스캠 범죄 등 우리 국민을 위협하는 초국가 범죄에 ‘강력 대응’하기로 함께 뜻을 모았습니다. 범죄의 양상이 국경을 넘어 고도화되는 만큼 국가 간 공조의 중요성이 더욱 중요해지고 있습니다. 국민의 생명과 안전을 철저히 지키고자 ‘한국인 전담 한-캄보디아 공동 태스크포스(TF)’, 일명 ‘코리아 전담반’을 11월부터 "},{"x":1.621,"y":0.536,"c":3,"m":"2025-10","d":"2025-10-28","f":2160,"i":"1983002997467893945","t":"취임 후 첫 아세안 국가 방문지로 오랜 우호국 말레이시아를 찾게 되어 뜻깊게 생각합니다. 안와르 이브라힘 말레이시아 총리는 APEC 정상회의 준비로 분주한 가운데서도 말레이시아를 방문한 것에 대해 감사를 표했습니다. 우리는 이번 한-말레이시아 FTA 체결을 계기로 양국 간 교역과 투자가 크게 확대되고, 디지털과 AI 등 전략산업 분야 협력도 가속화될 것으로"},{"x":0.998,"y":-0.018,"c":6,"m":"2025-10","d":"2025-10-28","f":3081,"i":"1983036757785600003","t":"대통령실 세 번째 공식 디지털 굿즈를 소개합니다. 10월 31일부터 11월 1일 경주에서 개최되는 APEC 2025 KOREA의 성공을 기원하는 마음을 담았습니다. 천년고도 경주의 고즈넉한 아름다움, 자개와 보자기 등 우리 고유의 전통미를 디지털로 표현해 대한민국의 품격을 한껏 느낄 수 있도록 했습니다. 이번 APEC 정상회의는 우리가 20년 만에 의장국으"},{"x":0.422,"y":1.962,"c":7,"m":"2025-10","d":"2025-10-29","f":2924,"i":"1983424734948958451","t":"아마존웹서비스(AWS) 맷 가먼 대표는 2031년까지 인천과 경기 지역에 AI 데이터센터를 구축하고 총 50억 달러 이상을 투자하겠다고 밝혔습니다. 지난 6월 울산에 이어 연이은 대규모 투자로, 아마존은 우리나라 역사상 최대 규모의 그린필드 투자 기록을 다시 세우게 됐습니다. 대한민국 AI 산업의 높은 성장 잠재력과 세계적 수준의 IT 인프라, 그리고 우리"},{"x":0.43,"y":2.089,"c":7,"m":"2025-10","d":"2025-10-29","f":4407,"i":"1983452418705969169","t":"한국을 향한 러브콜 🇰🇷💙 세계 최고 수준의 제조업 기반, ICT 역량, 우수한 인력, K-문화를 보유한 대한민국을 향해 첨단·주력 산업 분야 기업들의 투자 열풍이 일고 있습니다. 더욱 부강한 나라, 성장하는 대한민국을 위해 노력하겠습니다. 📎 #이재명 #APEC #APEC2025"},{"x":1.799,"y":0.147,"c":3,"m":"2025-10","d":"2025-10-30","f":6824,"i":"1983701989889581552","t":"아주 멋지고 아름다운 협상이었습니다. 이번 정상회담은 양국 간 신뢰와 협력을 더욱 굳건히 하며, 미래지향적 한미동맹 발전의 새로운 전기를 마련하는 황금같은 시간이었습니다. 특히 도널드 트럼프 대통령께 깊은 감사의 마음을 전합니다. 오래도록 이어져온 우정과 협력 속에서 한미동맹의 진정한 가치를 다시 한 번 확인할 수 있었습니다. 앞으로도 우리는 함께 손잡고 "},{"x":0.875,"y":-0.23,"c":5,"m":"2025-10","d":"2025-10-30","f":2016,"i":"1983711555645764005","t":"세계 평화와 국가 간 연대를 위하여 Cheers🥂 경주의 밤을 빛낸 화합과 연대의 시간! 함께 손잡고 평화와 번영을 향해 나아갑시다 #apec2025 #이재명 #특별만찬"},{"x":1.61,"y":0.759,"c":3,"m":"2025-10","d":"2025-10-31","f":1968,"i":"1984033144811786741","t":"대한민국과 뉴질랜드의 인연은 매우 깊습니다. 6·25전쟁 당시 뉴질랜드는 수교조차 하지 않은 머나먼 대한민국에 파병해 자유민주주의 수호에 함께 힘을 보탰습니다. 뉴질랜드의 숭고한 헌신을 결코 잊지 않을 것입니다. 전쟁의 상처를 극복하며 쌓아 올린 우리의 우정은 경제, 문화, 사회 등 다양한 분야에서 폭넓게 발전했습니다. 특히 최근 국방·방산 분야에서의 협력"},{"x":1.686,"y":0.56,"c":3,"m":"2025-10","d":"2025-10-31","f":1828,"i":"1984038195697488222","t":"베트남은 우리의 3대 교역국이자, 1만여 개의 우리 기업이 진출해 있는 핵심 협력국입니다. 특히 지난해 약 450만 명의 우리 국민이 베트남을 방문했고, 한-베트남 다문화 가정도 10만 가구에 이르는 등 매우 친숙하고 가까운 나라이기도 합니다. 어제 열린 르엉 끄엉 베트남 주석과의 정상회담에서는 국방·방산, 인프라, 문화·인적 교류, 초국가적 범죄 대응 등"},{"x":1.579,"y":0.636,"c":3,"m":"2025-10","d":"2025-10-31","f":3257,"i":"1984045604817993771","t":"취임 후 벌써 두 번째 정상회담이라 그런지 꼭 가까운 친구를 맞이하는 기분으로 앤소니 알바니지 호주 총리와 만남을 가졌습니다. 호주는 자유 진영의 일원으로서, 또 ‘포괄적 전략 동반자’로서 역내 안정과 번영에 함께 기여하고 있는 대한민국의 ‘멀지만 가까운’ 이웃입니다. 양국은 지금까지 쌓아온 굳건한 협력 관계를 토대로, 앞으로 국방･방산, 교역･투자, 핵심"},{"x":1.595,"y":0.599,"c":3,"m":"2025-10","d":"2025-10-31","f":1652,"i":"1984083060539998617","t":"태국은 6·25전쟁 당시 대한민국의 자유와 평화를 위해 함께 싸운 소중한 우방국이며, 매년 약 220만 명의 양국 국민이 서로 왕래하는 가까운 이웃입니다. 중요한 통상 파트너이자 방위산업 협력국이기도 합니다. 아누틴 찬위라꾼 태국 총리와 만나 가장 먼저 故시리킷 왕태후의 별세에 깊은 애도를 표했습니다. 이어 한-태국 전략적 동반자 관계 발전 방안에 대해 심"},{"x":0.581,"y":1.934,"c":7,"m":"2025-10","d":"2025-10-31","f":4043,"i":"1984181493883908214","t":"천년고도 경주의 번영과 성장은 끊임없는 연결과 혁신의 토대 위에 세워진 것입니다. 세계 각지 상인들이 험난한 바다와 사막을 오가며 물자를 교역하고, 새로운 문화와 지식을 확산시켰습니다. 아태 지역의 번영과 미래 또한 기업인들의 도전 정신에 달려있습니다. 오늘 만난 ABAC의 기업인들이 더 많이 교류하고, 거듭 혁신할 수 있도록 저와 APEC 지도자들은 적극"},{"x":0.47,"y":1.922,"c":7,"m":"2025-10","d":"2025-10-31","f":3386,"i":"1984222900669268166","t":"글로벌 AI 산업을 선도하는 엔비디아의 젠슨 황 대표와 만나 아시아태평양 지역의 AI 수도로 도약할 대한민국의 미래에 대해 함께 논의했습니다. AI 3대 강국 도약과 AI 기본사회 실현이라는 우리의 비전을 공유하고, AI 혁신의 혜택이 모두에게 고루 돌아가도록 해 국제사회에 기여하겠다는 의지도 확고히 표명했습니다. 엔비디아는 삼성전자와 SK, 현대를 비롯한"},{"x":1.393,"y":1.112,"c":3,"m":"2025-10","d":"2025-10-31","f":1958,"i":"1984223040759275967","t":"국제통화기금(IMF)은 대한민국과 오랜 역사를 함께해 온 든든한 글로벌 파트너입니다. 우리의 성장과 위기의 순간마다 조언과 지지를 보내 주었고, 이는 대한민국 경제가 안정적인 발전 궤도에 오르는 데 큰 힘이 되었습니다. 크리스탈리나 게오르기에바 IMF 총재는 한국 경제의 빠른 회복세를 긍정적으로 평가하고, \"내년에는 잠재성장률 수준에 근접하는 경제 성장을 "},{"x":1.366,"y":-0.188,"c":3,"m":"2025-11","d":"2025-11-01","f":1992,"i":"1984418084346827251","t":"아랍에미리트연합국(UAE)은 중동 지역에서 유일하게 우리나라와 ‘특별 전략적 동반자 관계’를 맺고 있는 중요한 파트너입니다. 양국 관계는 1980년 수교 이래 에너지와 건설 분야를 중심으로 발전해 왔으며, 특히 2009년 우리 기업의 UAE 바라카 원전 사업 수주를 계기로 새로운 전환점을 맞았습니다. 이후 2018년 양국 관계는 ‘특별 전략적 동반자 관계’"},{"x":0.932,"y":-0.178,"c":5,"m":"2025-11","d":"2025-11-01","f":2029,"i":"1984424628333527061","t":"이게 바로 APEC 만찬 클라스✨ #이재명 #apec2025 #만찬"},{"x":1.346,"y":0.579,"c":3,"m":"2025-11","d":"2025-11-01","f":2170,"i":"1984510540295946344","t":"칠레는 1949년 남미 최초로 대한민국 정부를 승인한 국가이자 우리의 첫 FTA 체결 파트너입니다. 중남미 지역의 가장 중요한 협력국 중 하나이기도 합니다. 1962년 수교 이후 우호 협력 관계를 지속적으로 발전시켜 왔으며 특히 핵심광물 공급망, 인프라, 방산, 신재생에너지와 같은 다양한 분야에서 전략적 동반자로서의 협력을 굳건히 하고 있습니다. 앞으로도 "},{"x":1.726,"y":0.602,"c":3,"m":"2025-11","d":"2025-11-01","f":2321,"i":"1984542931055976665","t":"필리핀은 6.25전쟁 당시 7천여 명의 참전용사를 파병하며 우리나라의 평화와 자유를 위해 함께 싸운 소중한 우방국입니다. 6.25전쟁 75주년을 맞아, 필리핀 용사들의 숭고한 희생에 깊은 경의를 표합니다. 처음으로 한국을 찾아주신 페르디난드 로무알데즈 마르코스 주니어 필리핀 대통령께 감사를 전합니다. 특별히 지난달 한-필리핀 전략적 동반자 관계 수립 1주년"},{"x":1.638,"y":0.493,"c":3,"m":"2025-11","d":"2025-11-02","f" ":"2026-04","d":"2026-04-21","f":6506,"i":"2046276978609918289","t":"대한민국과 인도는 신뢰와 우의를 바탕으로 번영하는 미래를 함께 열어갈 것입니다. 모디 총리님의 환대에 감사드리며, 총리님의 국빈방한을 손꼽아 기다리겠습니다."},{"x":1.178,"y":0.047,"c":4,"m":"2026-04","d":"2026-04-21","f":8970,"i":"2046485641836548354","t":"어제 저녁, 드라우파디 무르무 인도 대통령께서 베풀어 주신 만찬에 참석해 뜻깊은 시간을 보냈습니다. 사회적 제약과 개인적 어려움을 극복하고 공동체와 소외계층을 위해 헌신해 오신 대통령님의 삶에 깊은 감명을 받았습니다. 오늘날 인도가 보여주는 자신감 역시 대통령님의 용기와 비전에서 비롯된 것임을 느낄 수 있었습니다. 대한민국과 인도의 가능성은 무궁무진합니다."},{"x":0.663,"y":-0.806,"c":6,"m":"2026-04","d":"2026-04-22","f":4277,"i":"2046855471479595506","t":"지구 지키기, 우리 대한민국도 함께 합니다."},{"x":0.661,"y":-1.778,"c":6,"m":"2026-04","d":"2026-04-23","f":5115,"i":"2046978537610186976","t":"'베트남 히딩크' 박항서 전 베트남 국가대표 축구팀 감독님은 베트남 국민들에게 전설로 불리신다고 하지요. 그 바통을 이어받아 새로운 도전에 나서고 계신 우리 김상식 감독님께서도 좋은 성과를 만들어가시길 응원합니다. 두 분과 이야기를 나누며 축구가 단순한 스포츠를 넘어 사람과 사람, 나라와 나라를 이어주는 가교라는 점을 다시금 느꼈습니다. 그라운드 위에서 한"},{"x":1.096,"y":-1.175,"c":4,"m":"2026-04","d":"2026-04-23","f":5641,"i":"2046995832113975599","t":"한국과 베트남은 닮은 점이 참 많습니다. 외세의 시련을 이겨내고 스스로의 힘으로 나라를 일으켜 세웠고, 분단과 전쟁의 아픔을 겪고도 다시 일어섰습니다. 이러한 공통의 경험은 오늘날 양국 관계의 단단한 토대가 되고 있습니다. 우리는 서로에게 가장 중요한 교역 파트너로 자리 잡았고, 경제, 문화, 인적 교류 전반에 걸쳐 긴밀한 협력을 이어가고 있습니다. 뿐만 "},{"x":0.868,"y":-0.683,"c":4,"m":"2026-04","d":"2026-04-23","f":5457,"i":"2047088060421312874","t":"호치민 주석 묘소 앞에 서서 한 나라의 독립과 건국을 이끈 위대한 지도자의 삶을 되새겨보았습니다. 자주 역량을 키워 국가의 더 나은 내일을 만들어가고자 했던 그의 철학은 오늘날 베트남이 이룩한 발전의 토대이자 베트남 국민들의 무한한 자긍심이리라 생각합니다. 대한민국과 베트남은 서로의 성장을 응원하며 새로운 상생의 미래를 열어가고 있습니다. 수많은 베트남 청"},{"x":0.851,"y":-1.541,"c":4,"m":"2026-04","d":"2026-04-23","f":4821,"i":"2047142776886919473","t":"어제저녁, 또 럼 베트남 당서기장님께서 베풀어 주신 만찬에 참석했습니다. \"백 개의 강이 모여 하나의 바다를 이룬다\"라는 베트남의 속담처럼, 대한민국을 가로지르는 한강과 하노이를 품고 있는 홍강이 하나로 이어진 뜻깊은 시간이었습니다. 양국이 함께 나눈 비전과 약속은 수많은 협력의 물줄기가 되어 흐르고, 마침내 양국 번영이라는 바다에서 만나게 될 것입니다. "},{"x":1.374,"y":0.077,"c":7,"m":"2026-04","d":"2026-04-23","f":4361,"i":"2047325931203932455","t":"얼마 전 새로 선출되신 레 밍 흥 베트남 총리님을 찾아 뵈었습니다. 양국 간 협력의 방향과 미래 비전에 대한 깊이 있는 의견을 나누며 상호 신뢰를 더욱 공고히 하는 시간이었습니다. 가장 먼저  포용금융을 신속하게 그리고 최대한 확보하겠습니"},{"x":1.638,"y":0.08,"c":3,"m":"2026-05","d":"2026-05-14","f":3822,"i":"2054856301369557095","t":"미국 재무장관님과의 만남을 통해 양국 간 깊은 신뢰와 협력 의지를 다시금 확인했습니다. 대한민국과 미국은 서로의 성장을 뒷받침하는 가장 중요한 파트너입니다. 어려운 국제 정세 속에서도 양국이 함께 기회를 만들고, 공동 번영의 미래를 열어갈 수 있도록 긴밀히 협력해 나가겠습니다. 아울러 2028년 G20 의장국을 맡게 되는 만큼, 2026년 G20 의장국인 "},{"x":1.18,"y":0.47,"c":3,"m":"2026-05","d":"2026-05-14","f":13926,"i":"2054869198401405251","t":"지난주 BTS를 보기 위해 멕시코 소칼로 광장에 수만 명이 모인 것에서 확인할 수 있듯, 우리 문화에 대한 멕시코 국민들의 관심은 매우 뜨겁습니다. 멕시코가 매년 5월 4일을 '한인 이민자의 날'로 기념하고 있으며, 중남미 최초로 한국인이 이주한 국가라는 점 또한 양국 간 오랜 교류의 역사와 우호 관계를 잘 보여줍니다. 오늘 셰인바움 멕시코 대통령님과 통화"},{"x":0.27,"y":1.106,"c":4,"m":"2026-05","d":"2026-05-14","f":2690,"i":"2054883365225214052","t":"산업화 시대 '전 국민 잘 살기'를 목표로 큰 성과를 이룬 새마을운동은 모두가 함께 잘 사는 사회를 지향하는 우리 정부의 정책 방향과 결을 같이 합니다. 1980년 창립 이후 자연재해 피해 복구 지원, 대한민국 새단장, 차량 2부제 시행 등 변함없이 공동체를 위해 헌신해 주시는 새마을운동중앙회 여러분께 깊은 감사를 전합니다. 불확실한 국제 정세 속, 이념과"},{"x":0.138,"y":2.183,"c":7,"m":"2026-05","d":"2026-05-15","f":4809,"i":"2055004439992471954","t":"무조건 긴축 주장하는 분들이 나라를 생각한다면 꼭 봐야될 기사입니다. \"한국이 현재 매우 신중한 재정 정책 기조를 유지하고 있다\"면서 \"비록 현재 다소의 재정 확장 기조가 보이기는 하지만, 이러한 재정 확장은 매우 적절한 조치\"라고 평가했다. \"궁극적으로 한국의 생산성을 끌어올리는 것을 목표로 하는 구조 개혁을 뒷받침하기 위한 것이기 때문\"이라고 설명했다."},{"x":0.324,"y":1.979,"c":7,"m":"2026-05","d":"2026-05-15","f":3684,"i":"2055213007144435842","t":"노벨경제학상을 수상하신 피터 하윗 교수님을 만나 대한민국 경제의 지속적인 성장 전략에 대해 깊이 있는 대화를 나누었습니다. 대한민국이 AI, 반도체를 비롯한 첨단 기술 산업의 혁신을 선도하고 있다고 평가해 주신 점이 매우 뜻깊었습니다. 특히 연구개발 투자와 스타트업·중소기업에 대한 적극적인 지원, 그리고 성장의 혜택을 국민 모두가 함께 나누는 경제정책 방향"},{"x":-0.988,"y":-0.469,"c":8,"m":"2026-05","d":"2026-05-15","f":3959,"i":"2055233514086559944","t":"사적보복대행은 부탁받는 사람도 부탁하는 사람도 모두 중대범죄입니다. 사소하다 생각되는 일로 인생을 그르쳐서야 되겠습니까? 현대 문명국가에서 사적분쟁은 법질서에 따라 해결해야 합니다."},{"x":0.005,"y":1.404,"c":7,"m":"2026-05","d":"2026-05-15","f":3540,"i":"2055251374972273073","t":"대구경북통합신공항은 도심 군공항 이전을 통해 주민들의 오랜 불편을 해소하고, 국가안보 역량을 강화하는 중요한 국가적 과제입니다. 동시에 대구·경북이 국가균형발전의 중심축으로 도약하는 중대한 전환점이기도 합니다. 신공항 건설 예정지인 대구 군위군과 경북 의성군을 방문해 사업 추진 현황 및 고, 협력을 한층 확대해 나가자는 데 뜻을 함께 했습니다. 아울러 이탈리아에서 활동하고 있는 대한민국 기업, 그리고 재외동포 여러"},{"x":0.622,"y":-1.884,"c":4,"m":"2026-06","d":"2026-06-12","f":10136,"i":"2065337458267746808","t":"우리 축구 국가대표팀이 2026 FIFA 북중미 월드컵 첫 경기에서 체코를 상대로 값진 승리를 거두었습니다. 자랑스러운 태극전사 여러분, 그리고 감독님과 코칭스태프 분들께 뜨거운 박수를 보냅니다. 해발 1,500m가 넘는 쉽지 않은 환경 속에서도 집중력을 잃지 않고 끝내 승부를 뒤집어내며 국민들에게 큰 기쁨을 안겨주었습니다. 역전골이 터지는 순간 온 나라가"},{"x":0.506,"y":1.78,"c":7,"m":"2026-06","d":"2026-06-13","f":4566,"i":"2065584939286810779","t":"대한민국과 이탈리아 경제를 이끌어가는 기업인 여러분을 만났습니다. 인류 문명 발전을 이끌어온 이탈리아에서 양국의 미래 협력 방안을 함께 논의할 수 있어 매우 뜻깊었습니다. 기초과학과 디자인, 첨단 기술 분야에서 강점을 지닌 이탈리아와 세계적인 제조·혁신 역량을 갖춘 대한민국은 서로에게 더없이 좋은 협력 파트너입니다. 새로운 기술과 산업을 함께 개척하고, 눈"},{"x":-1.251,"y":0.277,"c":8,"m":"2026-06","d":"2026-06-13","f":5980,"i":"2065690478599884834","t":"비정상의 정상화.. 패가망신하는 주가조작 이제 그만하시고 정론직필하는 정상적 언론인으로 돌아가시기 바랍니다. 이미 저지른 일이라면, 공익신고 하면 처벌감면에 신고포상금도 지급되니 자수하기 바랍니다. 규칙을 지키는 선량한 국민들에게 피해를 끼치며, 규칙을 어겨 이익을 얻는 모든 행태가 구시대의 비정상이고, 함께 잘 사는 대한민국을 만들기 위해서는, 모든 비정"},{"x":-0.923,"y":0.235,"c":8,"m":"2026-06","d":"2026-06-13","f":8572,"i":"2065739112465014822","t":"여당과 야당 그리고 정치적책임 여당(與黨)의 사전적 의미는 더불어 함께 하는 무리입니다. 여당은 이미 집권에 성공하여 주어진 공식 권력으로 주장 아닌 행동을 통해 자신의 가치와 신념을 실현할 수 있는 대신, 국가의 미래와 온 국민의 삶을 통째로 책임져야 하며, 결과로 증명된 성과를 통해 재집권을 추구합니다. 반대로 조정에서 밀려나 들판에서 재집권을 위해 노"},{"x":0.978,"y":0.535,"c":6,"m":"2026-06","d":"2026-06-14","f":4503,"i":"2065841565080400021","t":"멜로니 총리님( )과 이탈리아 국민들의 환대에 대한민국 국민들과 함께 감사드립니다. 이탈리아와 대한민국은 '특별전략적 동반자로서' 복잡하고 불투명한 국제정세 속에서 더 새롭고 깊은 협력관계로 공동번영의 길을 열어 나갈 것입니다."},{"x":1.248,"y":0.698,"c":3,"m":"2026-06","d":"2026-06-14","f":4220,"i":"2065962481043071076","t":"토스카나는 우피치 미술관을 비롯해 세계적인 문화유산을 간직한 이탈리아 문화예술의 중심지입니다. 일찍부터 ‘피렌체 한국영화제’를 개최하며 한국 영화의 예술성과 작품성을 유럽과 세계에 알려온 든든한 문화 교류의 동반자이기도 합니다. 이번 방문 때 타결한 ‘한-이탈리아 영화 공동제작 협정’은 양국 국민에게 더욱 다양한 문화적 경험을 선사할 든든한 주춧돌이 될 것"},{"x":0.653,"y":-1.136,"c":4,"m":"2026-06","d":"2026-06-14","f":4279,"i":"2065966302746103831","t":"르네상스의 숨결이 생생히 살아 넘치는 우피치 미술관에서 ‘높은 문화의 힘’을 마주합니다. 당대 최고의 국제무역도시이자 금융도시, 첨단산업 중심지 피렌체의 저력은 사실 인류를 매료시킨 문화의 힘에서 나온 것이 아니었을지요. 한 점 한 점의 그림들이 수백 년의 시간을 지나 오늘의 우리와 만났습니다. 대한민국과 이탈리아가 쌓아갈 우정과 협력도 미래 세대에 영감과"},{"x":1.256,"y":0.851,"c":4,"m":"2026-06","d":"2026-06-14","f":5510,"i":"2066038704112808390","t":"성벽 너머 세상을 향해 평화와 사랑의 메시지를 전해온 성 밖 성 바오로 대성당에서 열리는 '평화와 연대를 위한 특별미사'에 참석합니다. 존경하는 유흥식 추기경님, 그리고 한국인 성직자 여러분과 함께할 수 있어 더욱 뜻깊고 감사한 마음입니다. 이어 레오 14세 교황님을 단독으로 뵙고, 파롤린 국무원장님과도 만날 예정입니다. 교황님께서는 한 청년이 내민 포켓몬"},{"x":-0.907,"y":-0.437,"c":8,"m":"2026-06","d":"2026-06-15","f":6607,"i":"2066382575980118075","t":"시위대는 의사표현을 넘어 타인의 권리침해가 없도록 자제해야.. 시위대의 민간인 출입제한 행패 등 위력에 의한 업무방해에 대해 행위자는 물론 공모자에 대해 엄중수사를 경찰에 지시했습니다. 잠실 봉쇄에 국제대회 출전 무산 위기… 체육단체 \"일터 돌려달라\" 호소"},{"x":-1.482,"y":-0.106,"c":8,"m":"2026-06","d":"2026-06-15","f":5957,"i":"2066388358126080277","t":"좋은 지적 감사합니다. 명백히 불법인듯 한데, 아직도 이런 행태가 계속 되고 있네요. 시정조치해야겠습니다. [단독] “800만원 쓰면 470만원 페이백” 입원하면 돈 주는 요양병원"},{"x":1.767,"y":-0.158,"c":3,"m":"2026-06","d":"2026-06-15","f":5695,"i":"2066522939865080175","t":"중동 관련 협상이 타결된 것을 환영합니다. 이는 국제사회가 오랫동안 기대해 온 사태 해결을 위한 중요한 진전입니다. 이번 협상 타결을 이끌어낸 트럼프 대통령의 리더십과 협상 당사국 및 관련국들의 외교적 노력을 높이 평가합니다. 이번 합의를 통해 중동 지역의 평화와 안정이 조속히 회복되고, 역내 주민들의 안전과 번영을 위한 기반이 마련되길 기대합니다. 아울러"},{"x":1.256,"y":0.814,"c":4,"m":"2026-06","d":"2026-06-16","f":4244,"i":"2066672104976924988","t":"레오 14세 교황님께서는 아우구스티노 수도회 총장 재임 시절 다섯 차례나 한국을 방문하시며 우리나라에 각별한 관심을 보여주신 분입니다. 그래서인지 오늘의 만남은 첫 알현이라는 사실이 무색할 만큼 따뜻하고 정겨운 분위기 속에 이루어졌습니다. 이어 파롤린 교황청 국무원장님을 예방해 한반도 평화를 비롯한 국제사회의 여러 도전과 과제에 대해 의견을 나누었습니다. "},{"x":0.875,"y":-0.976,"c":4,"m":"2026-06","d":"2026-06-16","f":4162,"i":"2066679650106110199","t":"한국과 이탈리아를 가장 가깝게 이어주는 가교이자 양국 우정의 원천, 이탈리아 동포 여러분께 인사드렸습니다. 사람과 문화를 중요하게 여기는 이탈리아 사회 속에서, 남다른 성실함과 책임감으로 신뢰를 쌓아 오신 동포 여러분이 바로 우리 외교의 가장 든든한 뿌리입니다. 우리 동포들이 대한민국이라는 자긍심을 갖고 현지 사회의 당당한 주역으로 성장할 수 있도록 정부가"},{"x":1.496,"y":0.91,"c":3,"m":"2026-06","d":"2026-06-16","f":6057,"i":"2066778344679735495","t":"작년 6월 취임 직후 G7 정상회의에 참석해 민주주의를 회복한 대한민국의 모습을 전 세계에 알렸던 것이 엊그제 같은데, 어느덧 1년이 흘렀습니다. 오늘 저는 다시 2026 G7 정상회의가 열리는 프랑스 에비앙으로 향합니다. 2년 연속 회의에 초청받은 것은 대한민국에 대한 국제사회의 신뢰와 기대를 보여주는 매우 뜻깊은 일입니다. 국제 연대와 모두를 위한 성장"},{"x":1.209,"y":0.763,"c":4,"m":"2026-06","d":"2026-06-17","f":4823,"i":"2066919502840025197","t":"멜로니 총리님의 세심한 배려와 신속한 대응에 감사드립니다. 이번 순방을 통해 이탈리아에서 활동하는 한국인 관광 가이드분들과 우리 국민께 반가운 소식을 한 가지 전할 수 있게 되었습니다. 연간 백만 명에 달하는 우리 국민이 이탈리아를 방문할 정도로 양국의 인적 교류가 점차 활발해지고 있습니다. 하지만 정작 한국어로 관광 안내를 할 수 있는 공식 가이드는 턱없"},{"x":1.405,"y":0.14,"c":3,"m":"2026-06","d":"2026-06-17","f":7310,"i":"2066985589384331271","t":"지금까지 인도와 대한민국은 경제규모나 협력 잠재력에 비해 협력 수준이 매우 낮았습니다. 저와 모디 총리는 한국과 인도간 경제 문화 사회 모든 면에서 향후 협력을 강화하고 양국을 새로운 관계로 발전시키기로 하였습니다."},{"x":1.748,"y":1.123,"c":6,"m":"2026-06","d":"2026-06-17","f":4056,"i":"2066987503803154670","t":"마크 카니 캐나다 총리님 과 양국관계의 호혜적 발전방안에 대해 깊이있는 대화를 나누었습니다. 한국과 캐나다는 유사입장국으로서 함께 할 수 있는 일이 매우 많습니다. 캐나다와 대한민국의 변치않을 우정을 기원합니다."},{"x":1.495,"y":0.493,"c":3,"m":"2026-06","d":"2026-06-17","f":3773,"i":"2067034489747116436","t":"7개월 만에 프리드리히 메르츠 독일 총리와 다시 만났습니다. 양국 관계의 미래에 대한 건설적 논의를 나눌 수 있었던 뜻깊은 시간이었습니다. 한국과 독일은 수교 이후 140여 년간 우호 협력 관계를 단단히 발전시켜 왔습니다. 그 결과 자동차, 반도체, 바이오부터 통상·투자 분야에 이르기까지 다방면에 걸친 긴밀한 협력을 구축하고 있습니다. 양국은 기존의 굳건한"},{"x":1.646,"y":0.784,"c":3,"m":"2026-06","d":"2026-06-17","f":6837,"i":"2067042039800410353","t":"마크 카니 캐나다 총리님과 정상회담을 가졌습니다. 1년 전 총리님의 초대로 G7 정상회의에 참석했던 기억이 생생한데, 벌써 1년이 지나 두 번째 G7 정상회의에서 만나게 되어 더욱 뜻깊은 시간이었습니다. 캐나다는 자유와 평화를 위해 함께 싸워준 소중한 친구이자, 한반도 평화와 번영에 기여해 온 핵심 우방국입니다. 이러한 깊은 신뢰와 유대감을 토대로, 양국의"},{"x":1.567,"y":0.512,"c":3,"m":"2026-06","d":"2026-06-17","f":4903,"i":"2067252195192709411","t":"G7 정상회의를 계기로 윌리엄 루토 케냐 대통령님과 처음 만났습니다. 1964년 수교 이후 다양한 분야에서 쌓아온 협력 관계를 토대로, 양국 관계의 도약을 모색한 뜻깊은 시간이었습니다. 케냐는 대한민국의 동아프리카 지역 중점 협력국입니다. 그 중요성에 걸맞게, 양국은 경제·투자, 핵심 광물, 인프라, 개발 협력, 과학·ICT 등 다방면에서 호혜적인 협력을 "},{"x":-0.106,"y":-1.589,"c":0,"m":"2026-06","d":"2026-06-18","f":27835,"i":"2067263591275995157","t":"어제 저녁 트럼프 대통령님과 함께 하며 약 90분 간 한반도 평화와 한미관계를 놓고 속 깊은 이야기를 나누고 많은 진전이 있었습니다. 오늘 마지막 오찬에서는 지금까지 사용하고 있던 서명용 펜을 제게 선물로 주셨습니다. 아마도 처음 정상회담때 제가 쓰던 펜을 선물 받은 기억 때문이 아닐까 생각됩니다. 어제 만찬때 골프 얘기를 하며 우리 부부와 골프를 함께 하"},{"x":0.311,"y":-1.628,"c":0,"m":"2026-06","d":"2026-06-19","f":8747,"i":"2067743695861101006","t":"세계적인 챌리스트 요요마님의 공연이 끝난후 요요마님이 공연에서 쓴 첼로 활을 들고 기념사진을 찍은 겁니다. 감동적인 공연이었습니다. 잘 아시겠지만, 맨 좌측이 요요마님입니다. 감사합니다."},{"x":0.111,"y":0.517,"c":6,"m":"2026-06","d":"2026-06-21","f":6331,"i":"2068686068753334535","t":"현실경제는 물론 국가경쟁력도 조금씩 나아지고 있습니다. 모두 국민 여러분의 피나는 노력의 결과입니다. 대한민국은 정치(민주주의),경제(반도체 방산 등), 문화(k-pop 등) 등 모든 면에서 세계를 선도하며 세계 각국의 세계인들로부터 부러움을 사고 있습니다. 세계시민의 이상국가, 대체불가 대한민국을 향해 조금 더 힘을 내 주시고, 작은 차이를 넘어 힘을 모"},{"x":-0.971,"y":-0.863,"c":8,"m":"2026-06","d":"2026-06-22","f":5220,"i":"2068724453476114522","t":"경찰청장님의 보고사항입니다. 수고하시는 경찰관들에게 감사와 격려 부탁드립니다. 혹여라도 보복대행 이런 거 절대로 하시면 안됩니다. 구속까지 되는 중대범죄입니다. 대통령님께서 최근 지시하셨던 '사적 보복대행' 범죄에 대한 주요 수사성과입니다. 사적 보복대행은 작년 8월 대구에서 최초 발생한 이후, 전국적으로 총 87건(피해자 128명)이 발생하였습니다. 경찰"},{"x":1.35,"y":-0.689,"c":4,"m":"2026-06","d":"2026-06-23","f":6481,"i":"2069408328753856583","t":"취임 후 지난 1년 동안 50개국이 넘는 정상들과 만나 100여 차례의 정상회담과 회동을 가졌습니다. 세계 각국 지도자들과 신뢰를 쌓고 협력의 지평을 넓혀올 수 있었던 것은 본국과 대한민국을 잇는 주한외교단 여러분이 계셨기 때문입니다. 앞으로도 각국과 대한민국이 공동의 도전에 함께 대응하고, 상생과 번영의 미래를 만들어갈 수 있도록 더욱 애써주시길 부탁드렸"},{"x":0.628,"y":-0.149,"c":5,"m":"2026-06","d":"2026-06-24","f":4372,"i":"2069732629344330061","t":"6월 24일 재명로그 #이재명 #대통령 #해병대 #연평부대"},{"x":-0.005,"y":-0.932,"c":4,"m":"2026-06","d":"2026-06-24","f":10749,"i":"2069737480774099121","t":"참담하고 괴로운 마음입니다. 12년을 어떤 마음으로 하루하루 살아내셨을지 감히 헤아리기조차 어렵습니다. 대학에 진학하고, 취업을 하고, 연애도 하고. 남들에게는 너무도 당연한 보통의 일상을 살기 위해 얼마나 많은 노력이 필요했을지요. 걷잡을 수 없이 마음이 무너지는 날에도 가족과 지인들에게 걱정 끼치고 싶지 않아 애써 괜찮은 척 하셨으리라 생각합니다. 하루"},{"x":-0.497,"y":-1.137,"c":8,"m":"2026-06","d":"2026-06-24","f":9399,"i":"2069756020373815544","t":"박찬대 인천시장당선자님 축하드립니다. 부탁이 있습니다. 오늘 만난 연평도 주둔 병사들이 휴가로 육지로 왕래할 때 배삯이 무려 11만원이라 엄청 부담된다고 하소연했습니다. 인천시민들은 1500원인가 한다며 같은 혜택을 받게 해 달라고 합니다. 실제 인천에 거주하는 병사들이고 나라 위해 희생하는 청년들이니 인천시민에 준하는 혜택을 주시면 어떨까요. 그리고 혹 "},{"x":-0.244,"y":-0.374,"c":1,"m":"2026-06","d":"2026-06-25","f":4365,"i":"2070081324040568848","t":"베네수엘라 북서부 야라쿠이주 일대에서 규모 7 이상의 강 1603401377644877","t":"저와 함께 하기위해 계양구로 이사오신 분들이 꽤 있다고 들었는데 그 분들 중 한분이시군요. 뉘신지 모르오나 진심으로 고맙고 또 미안합니다. 좋은 세상을 향한 님의 그 절절한 열망에 조금이라도 보답할 수 있도록 분초를 아껴 죽을 힘을 다하겠습니다. 그래서 님과 같은 보이지 않는 수많은 동지들이 그토록 꿈꾸는 희망있는 대동세상이 될 수 있도록 손톱만큼의 성과라"},{"x":0.608,"y":-0.213,"c":5,"m":"2026-06","d":"2026-06-30","f":5110,"i":"2071952165296652551","t":"하늘에서 바라본 서남권의 미래 #이재명 #대통령 #서남권 #해상풍력"},{"x":-0.155,"y":0.916,"c":7,"m":"2026-07","d":"2026-07-01","f":3663,"i":"2072107928916783273","t":"정부와 국민이 함께하는 첫 부처 업무보고를 시작합니다 국민주권정부의 부처 업무보고에 함께 해주실 200분의 국민 참관단 여러분을 기다립니다. 이번 업무보고는 일방적으로 성과를 발표하는 것이 아닌, 국민 여러분과 함께 정책의 성과를 확인하고 앞으로의 국정 방향을 논의하는 자리입니다. 정책이 국민의 삶 속에서 어떻게 구현되고 있는지 직접 살피고, 나아가 더 나"},{"x":-0.294,"y":-1.627,"c":0,"m":"2026-07","d":"2026-07-01","f":6211,"i":"2072179756230197272","t":"감사합니다. 한 총리님에게 거는 기대가 큽니다. 잘 해 주실 것으로 확신합니다."},{"x":0.618,"y":-1.942,"c":4,"m":"2026-07","d":"2026-07-01","f":8169,"i":"2072195957836615869","t":"누구보다 마음이 무거울 대한민국 축구 국가대표 선수 여러분께 깊은 위로를 전합니다 지난 4년 동안 오직 월드컵만을 바라보며 수 차례의 평가전을 치르고, 예기치 못한 부상과 고된 재활을 이겨내셨지요. 뜨거운 태양 아래 온몸이 새까맣게 익고, 땀으로 젖은 유니폼을 수없이 갈아입으며 한계를 넘어서는 훈련을 반복하셨으리라 생각합니다. 몸의 고통보다 더 힘들었던 것"},{"x":0.689,"y":-0.073,"c":5,"m":"2026-07","d":"2026-07-01","f":4344,"i":"2072230195172667482","t":"성공한 민주정부를 위해, 하나의 마음으로 #이재명 #문재인 #대통령"},{"x":0.088,"y":1.36,"c":7,"m":"2026-07","d":"2026-07-01","f":5696,"i":"2072278448685654445","t":"국토균형발전의 새 역사를 써 내려갈 위대한 항해를 시작합니다 무등산과 영산강의 생명력이 하나로 이어져 마침내 '전남광주통합특별시'라는 희망의 돛을 올리게 되었습니다. 오늘의 통합은 새로운 국가 발전의 동력을 만드는 역사적 전환점이자 지방 주도 성장으로 대한민국의 미래를 바꾸는 담대한 도전입니다. 전남광주통합특별시가 남부권 발전을 이끄는 중심축으로 자리매김하"},{"x":-0.564,"y":0.081,"c":1,"m":"2026-07","d":"2026-07-01","f":7958,"i":"2072280304484601892","t":"또 한 명의 소중한 생명을 잃었습니다 사람을 살리는 병원에서 누군가는 깊은 상처를 입고 끝내 삶을 포기하길 택했습니다. 교육이라는 이름으로도, 관행이라는 이름으로도, 조직문화라는 이름으로도 '태움'은 결코 정당화될 수 없는 끔찍한 폭력입니다. 이번 사건의 진상을 철저히 밝혀야 합니다. 즉시 해당 병원에 대한 근로감독에 착수하고, 유사 위험이 있는 의료기관을"},{"x":0.467,"y":0.131,"c":5,"m":"2026-07","d":"2026-07-02","f":5770,"i":"2072615720106766648","t":"니가 좋아 #이재명 #이재용 #니가좋아"},{"x":0.164,"y":1.95,"c":7,"m":"2026-07","d":"2026-07-04","f":6309,"i":"2073218731745153529","t":"천지개벽을 위한 상전벽해 수준의 국토대전환은 제가 취임하기 전 아주 오래전부터 꿈꿔왔던 일입니다. 취임직후부터 균형발전을 위한 대규모 지방투자와 개발을 위해 국가 차원의 준비를 하며 경제계에 협조요청을 해 왔는데 속도가 크게 나지 않았습니다. 그러던 중 최근에 정부의 인공지능 등 미래 첨단선업 중점 투자정책과 인공지능 반도체 산업의 구조적이고 장기적이며 폭"},{"x":1.775,"y":0.205,"c":3,"m":"2026-07","d":"2026-07-05","f":4502,"i":"2073436763146838527","t":"미국 독립 250주년을 맞아 트럼프 대통령님과 미국 국민 여러분께 축하를 전합니다. 250년 전 자유와 민주주의라는 이상을 향한 위대한 여정을 시작한 미국은 수많은 도전을 극복하며 국제사회의 평화와 번영을 이끌어 왔습니다. 대한민국은 이러한 가치를 함께 지켜온 미국의 소중한 동반자입니다. 70여 년 전 한국전쟁 당시 수많은 미국의 젊은이들은 대한민국의 자유"},{"x":1.935,"y":0.362,"c":3,"m":"2026-07","d":"2026-07-07","f":4565,"i":"2074267211213177343","t":"마크 루터 NATO 사무총장님의 초청을 받아 NATO 정상회의가 열리는 튀르키예로 향합니다. 지난달 G7 정상회의에 이어 이번에는 NATO 무대에서 세계 평화와 안보를 위한 대한민국의 역할을 더욱 넓혀가려 합니다. 얼마 전 사무총장님께서는 \"한국을 사랑한다\"며 우리 방위산업 기반이 \"환상적\"이라고 평가해 주셨다지요. 전쟁의 폐허를 딛고 나라를 지키기 위해 "},{"x":0.687,"y":0.576,"c":5,"m":"2026-07","d":"2026-07-07","f":29398,"i":"2074445440670732624","t":"🇹🇷 앙카라에 도착했습니다"},{"x":1.974,"y":0.231,"c":0,"m":"2026-07","d":"2026-07-07","f":4531,"i":"2074471407594168591","t":"전화로만 인사 나누던 마크 루터 NATO 사무총장님( ). 직접 뵈니 훨씬 더 반갑고 든든합니다. 따뜻한 환대에 진심으로 감사드립니다."},{"x":2.01,"y":0.316,"c":5,"m":"2026-07","d":"2026-07-07","f":4467,"i":"2074478309224919195","t":"이번 정류장은 나토입니다🌐 #이재명 #NATO #natosummit #türkiye"},{"x":1.969,"y":0.324,"c":3,"m":"2026-07","d":"2026-07-07","f":4326,"i":"2074479945217372326","t":"NATO와 함께 ‘더 안전한 세계’를 향해 잠시 후 NATO 방산포럼 4세션 연설 시작합니다."},{"x":1.88,"y":0.348,"c":3,"m":"2026-07","d":"2026-07-08","f":3374,"i":"2074531919510086080","t":"NATO 정상회의가 열리는 앙카라에서 마크 루터 사무총장님( )을 만나 한-NATO 협력을 한 단계 더 발전시켜 나가기 위한 방안을 논의했습니다. 이번에 협상을 개시한 한-NATO 「조달 기본협정」은 우리 방산기업들이 NATO 방산시장으로 더 넓게 나아갈 수 있는 든든한 기반이 될 것입니다. 세계 최고 수준의 기술력과 경쟁력을 갖춘 우리 기업들이 더 큰 무"},{"x":0.9,"y":1.529,"c":7,"m":"2026-07","d":"2026-07-08","f":5368,"i":"2074757595701952902","t":"불확실한 시대일수록 행동은 더 과감해야 하고, 협력은 더 빠르게 이루어져야 합니다. 에너지 위기 대응을 위해 지혜를 모았던 것처럼, 방위산업에서도 서로의 강점을 더해 모두 함께 성장하는 길을 열어가길 기대합니다🙏🏻 #NATO"},{"x":-1.466,"y":0.964,"c":2,"m":"2026-07","d":"2026-07-08","f":3597,"i":"2074761417018978765","t":"자본시장 공정성은 포기할 수 없는 가치입니다. 주가조작은 금감원 경찰 검찰의 3중 그물에 반드시 걸립니다. #주가조작_패가망신"},{"x":1.546,"y":0.41,"c":3,"m":"2026-07","d":"2026-07-08","f":3624,"i":"2074776992336269334","t":"대한민국과 노르웨이는 신재생에너지와 조선·해양, 방산을 비롯한 다양한 분야에서 협력하며 우정을 쌓아왔습니다. 특히 노르웨이는 K9자주포와 천무 다연장로켓 등 우리 방산 역량에 꾸준한 신뢰를 보내주고 있는 국가이기도 합니다. 요나스 가르 스퇴레 노르웨이 총리님과 만나 올해 초 체결된 천무 다연장로켓 획득 계약을 계기로 방산 협력을 한층 강화하고, 미래 신산업"},{"x":2.004,"y":0.308,"c":5,"m":"2026-07","d":"2026-07-08","f":3013,"i":"2074811166241776002","t":"정상들은 만나면 OOO 얘기 합니다 ⚽️ #이재명 #NATO #노르웨이"},{"x":1.864,"y":0.721,"c":3,"m":"2026-07","d":"2026-07-08","f":3765,"i":"2074838618947170399","t":"볼로디미르 젤렌스키 우크라이나 대통령님과 첫 정상회담을 가졌습니다. 우크라이나의 현재 상황, 평화와 회복을 위한 방안에 대해 깊이 있는 대화를 나눈 뜻깊은 시간이었습니다. 이번에 발표한 '‘對우크라이나 1억불 포괄적 지원 공약’에 대해서도 직접 설명드렸습니다. 같은 취지에서 우크라이나 복구와 재건을 위한 국제사회의 노력에 동참해 나갈 것이라는 말씀도 전했습"},{"x":1.494,"y":-0.547,"c":4,"m":"2026-07","d":"2026-07-08","f":4125,"i":"2074867508620755256","t":"\"이웃사촌이 멀리 있는 친척보다 낫다\" 우리에게 익숙한 이 속담이 몽골에서도 같은 뜻으로 쓰인다는 것을 알고 계시는지요. 이웃을 아끼고 정을 나누는 마음만큼은 두 나라가 많이 닮아 있다는 생각이 들어 더욱 반갑게 느껴집니다. 몽골은 대한민국을 무지개의 나라라는 뜻의 '솔롱고스'라고 부르고, 우리는 몽골을 '푸른 하늘의 나라'라고 합니다. 서로를 일컫는 이름"},{"x":0.7,"y":0.664,"c":0,"m":"2026-07","d":"2026-07-09","f":5665,"i":"2074984827011690617","t":"🇲🇳칭기즈칸 국제공항 도착했습니다. 환대의 뜻으로 건네주신 몽골의 전통 과자 '아롤’ 정말 맛나더군요. Баярлалаа 🙏"},{"x":1.638,"y":0.327,"c":3,"m":"2026-07","d":"2026-07-09","f":2850,"i":"2074992891148337230","t":"이번 NATO 정상회의를 계기로 니쿠쇼르 단 루마니아 대통령님과 처음 만나 뜻깊은 대화를 나눴습니다. 루마니아는 아시아 국가 가운데 가장 먼저 대한민국과 전략적 동반자 관계를 맺은 특별한 친구이자 협력국입니다. 루마니아는 신궁, K9 자주포 도입 등 우리 방산 역량에 꾸준한 신뢰를 보여주고 있습니다. 앞으로도 방산을 비롯해 원전과 인프라 등 여러 분야에서 "},{"x":0.113,"y":2.209,"c":7,"m":"2026-07","d":"2026-07-09","f":4865,"i":"2075043113467543999","t":"1.9%→2.6%, 한국경제 성장률 대폭 상향 조정 국제통화기금(IMF)이 올해 한국 경제 성장률을 2.6%로 전망했습니다. 이는 지난 4월에 전망한 수치 대비 0.7%포인트 상향된 것으로 발표대상 30개국 가운데 가장 큰 상승폭입니다. 반면, 올해 세계경제 성장률 전망은 지난 4월보다 0.1% 포인트 내린 3.0%로 하향조정되었습니다. IMF는 한국의 내"},{"x":0.712,"y":0.082,"c":5,"m":"2026-07","d":"2026-07-09","f":3478,"i":"2075051075384844642","t":"이번 정류장은 몽골입니다🇲🇳 #이재명 #대통령 #몽골 #Монгол"},{"x":0.702,"y":0.117,"c":5,"m":"2026-07","d":"2026-07-09","f":3925,"i":"2075206059174838361","t":"This is Mongol 🇲🇳 #이재명 #УхнаагийнХүрэлсүх #mongolia #TheHU"},{"x":1.302,"y":-0.147,"c":7,"m":"2026-07","d":"2026-07-09","f":3425,"i":"2075214769393668421","t":"동북아와 유라시아를 연결해 온 몽골의 수도 울란바타르에서, 양국의 공동 번영을 이끌 경제인 여러분을 만났습니다. 한국과 몽골은 기술과 자원, 자본과 인력 등 서로의 강점이 맞닿아 있는 최적의 파트너입니다. 양국의 잠재력이 더 큰 결실로 이어질 수 있도록, '몽탄'으로 대표되는 상호 호혜적 협력의 모델을 더욱 확산시켜 나가겠습니다. 핵심 광물 공급망 분야에서"},{"x":-1.266,"y":-1.283,"c":7,"m":"2026-07","d":"2026-07-10","f":5402,"i":"2075270790761906614","t":"한때 다른 나라에선 모범적인 글로벌 기업이 유독 우리나라에서만 반노동적이고 불투명한 경영을 해서 빈축을 사는 경우가 있었습니다. 우리나라 정부가 반노동 정책을 구사하고 부정부패로 물들어 있던 시절의 이야기지만, 이제는 대한민국이 세계를 선도하는 모범 사회 ㆍ 모범 정부로 거듭나고 있는데 그러한 구태경영 행태가 발생한다면 용납할 수 없습니다. 우리 기업도 해"},{"x":-1.876,"y":0.379,"c":2,"m":"2026-07","d":"2026-07-10","f":3883,"i":"2075429960089538941","t":"부동산에 대한 적정한 보유세, 실주거용 1주택과 비주거용 또는 다주택에 차이를 둘 지, 어느정도 차이가 적정한지, 초고가 실거주 주택은 별도 처리할 지, 추가 부담할 초고가주택은 얼마로 할 지, 보유세와 거래세의 관계, 보유세수의 용도 등 주요 쟁점들을 미리 공지하면 국민적 토론에 도움이 되겠지요? 여러분도 주요 쟁점에 대한 의견을 내 보시기 바랍니다. 관"},{"x":1.625,"y":1.122,"c":3,"m":"2026-07","d":"2026-07-10","f":7362,"i":"2075509392548802704","t":"인도와 뉴질랜드 양국의 우정과 발전을 기원합니다. भारत और न्यूजीलैंड दोनों देशों की दोस्ती और प्रगति के लिए शुभकामनाएं। Wishing for the friendship and progress of both India and New Zealand"},{"x":0.007,"y":-0.678,"c":4,"m":"2026-07","d":"2026-07-10","f":3783,"i":"2075531203521003591","t":"대한민국과 몽골 우호의 상징인 이태준 선생은 1914년 울란바타르에 동의의국을 세워 전염병에 시달리던 수많은 몽골 국민을 치료하며 깊은 신뢰와 존경을 받으신 분입니다. 선생께서는 의술로 생명을 살리는 데 그치지 않고, 각지의 애국지사들과 함께 항일 독립운동을 펼치며 상하이 임시정부와 독립운동가들을 지원하는 등 조국의 독립을 위해서도 헌신하셨습니다. 유해를 "},{"x":1.062,"y":-1.11,"c":4,"m":"2026-07","d":"2026-07-10","f":4183,"i":"2075532416366805230","t":"푸른 하늘과 광활한 초원의 나라 몽골에 계신 우리 동포 여러분을 찾아 뵈었습니다. 이국 땅에서 얼굴을 마주하며 서로의 안부를 물을 수 있어 무척이나 반가운 시간이었습니다. 대개 국가간의 교류는 정부가 먼저 길을 열고 민간의 교류로 이어지지만, 한-몽 관계는 조금 달랐습니다. 이미 한 세기 전부터 수많은 우리 동포들이 이 땅을 찾아 학교를 세우고, 기술을 나"},{"x":1.531,"y":-0.52,"c":4,"m":"2026-07","d":"2026-07-10","f":3107,"i":"2075581925386076333","t":"몽골의 산닥 뱜바척트 국회의장님, 냠오소르 오츠랄 총리님과 차례로 만나 양국의 미래 협력에 대해 진솔한 이야기를 나눴습니다. 어제 후렐수흐 대통령님과 함께한 약속들이 선언에 그치지 않고 체감할 수 있는 성과로 이어질 수 있도록 몽골 국회와 정부의 관심과 협력을 부탁드렸습니다. 두 분 역시 정상회담에서 합의한 내용을 충실히 이행해 경제와 투자, 문화, 인적교"},{"x":0.807,"y":-0.083,"c":5,"m":"2026-07","d":"2026-07-11","f":4081,"i":"2075867698412851458","t":"나나나나나나담 축제 몽골 최대의 민족 축제 #나담축제 맛보기 #Naadam2026 #Наадам #Mongolia #Монгол"},{"x":0.807,"y":-0.083,"c":5,"m":"2026-07","d":"2026-07-11","f":6141,"i":"2075876670561788335","t":"세상이 날 오라 하네 #Naadam2026 #Наадам #Mongolia #Монгол"},{"x":0.712,"y":0.047,"c":5,"m":"2026-07","d":"2026-07-11","f":5263,"i":"2075901247241265537","t":"감사했습니다, 몽골!🛫 #이재명 #대통령 #mongolia #Монгол"},{"x":-0.978,"y":0.321,"c":8,"m":"2026-07","d":"2026-07-13","f":5825,"i":"2076612528894058628","t":"사실에 기초한 보도가 아니라 조작에 기초한 정치적 공격은 언론으로서 온당한 태도가 아닙니다."},{"x":1.539,"y":0.864,"c":3,"m":"2026-07","d":"2026-07-14","f":3879,"i":"2077038308191068174","t":"대한민국과 영국은 자유, 민주주의, 법치라는 공동의 가치를 바탕으로 안보와 경제, 첨단기술, 문화 등 다양한 분야에서 협력을 확대해 온 글로벌 전략적 동반자입니다. 오늘 앤 영국 공주님을 만나 양국이 앞으로 함께 만들어갈 미래 협력 방안에 대해 뜻깊은 대화를 나눴습니다. 故 엘리자베스 2세 여왕님의 1999년 국빈 방한에 이어 이번 앤 공주님의 방한은 대한"},{"x":-0.564,"y":-0.853,"c":0,"m":"2026-07","d":"2026-07-15","f":7797,"i":"2077268863226622386","t":"다행입니다. 잘 하셨습니다. 감사합니다. 김영훈이라는 한 장관의 노력이 죽을 사람 수백명을 살리신 겁니다. 그런데 더 줄여야 합니다. 아직도 너무 많이 죽습니다."},{"x":0.062,"y":-1.371,"c":4,"m":"2026-07","d":"2026-07-15","f":5092,"i":"2077309676308566427","t":"밤낮없이 애써주고 있는 청와대 가족들과 같이 콩국수 한 그릇 먹었습니다. 우리 콩과 밀로 만든 맛있는 콩국수 한 그릇에 잠시 초복 더위 마저 잊어버린 즐거운 시간이었습니다. 크고 작은 어려움 속에서도, 각자의 자리에서 묵묵히 소임을 다해주고 계신 청와대 식구들을 생각하면 미안하고 또 든든한 마음입니다. 비록 몸은 바쁘고 고되도, 청와대에서 일한다는 자긍심과"},{"x":-1.116,"y":-0.86,"c":8,"m":"2026-07","d":"2026-07-15","f":4172,"i":"2077346223946936602","t":"불법 고리사채는 철저히 단속하고 엄벌합니다. 수고하는 경찰에게 감사드립니다. 시민 여러분의 신고도 부탁드립니다. 연 20% 초과 이자 대여 시 이자 무효라 이자는 안 줘도 되고, 이자 연 60% 초과 대여 약정은 전부 무효라 원금도 반환하지 않아도 됩니다. 강압적인 변제 독촉도 범죄입니다."},{"x":-1.049,"y":-0.54,"c":8,"m":"2026-07","d":"2026-07-15","f":4044,"i":"2077349284748607525","t":"\"유죄의 증거는 무죄의 증거보다 훨씬 더 엄격한 증거능력과 신빙성을 갖춰야한다. 범죄의 증명은 합리적 의심의 여지가 없을 정도여야 하고, 의심스러울 때는 피고인의 이익으로 판단하여야 한다. 열사람의 범인을 놓치더라도 단 한명의 억울한 사람이 처벌받게 해서는 안된다.\" 형사소송법을 배울때 가장 먼저 가르치는 가장 초보적이고 중요한 원칙이다. 그런데 유죄의 증"},{"x":-0.472,"y":-0.803,"c":6,"m":"2026-07","d":"2026-07-17","f":3007,"i":"2077782458062557220","t":"박홍근 장관님과 기획예산처 공직자 여러분 수고 많으셨어요. 감사합니다."},{"x":0.064,"y":-1.092,"c":4,"m":"2026-07","d":"2026-07-17","f":4387,"i":"2077924318642881007","t":"오늘 '빛의 위원회 출범기념 시민 초청행사'에 함께해 주시는 분들께 드리는 감사장을 첨부합니다. 한겨울의 매서운 추위를 뚫고 대한민국의 민주주의를 지켜주신 모든 분께 직접 전해드리고 싶지만, 사진으로나마 마음을 전합니다. 한 분 한 분의 이름을 넣어 간직해 주시면 좋겠습니다. 시린 겨울 아스팔트 위에서 은박담요 한 장을 서로 나누며 밤을 지새웠던, 혹시 모"},{"x":0.257,"y":-1.648,"c":0,"m":"2026-07","d":"2026-07-17","f":4830,"i":"2077943660092752198","t":"수고 많으셨어요. 진심으로 감사 드립니다. 그 큰 용기와 위대한 실천들을 반드시 기록으로 남겨야지요."},{"x":-1.692,"y":-0.289,"c":8,"m":"2026-07","d":"2026-07-17","f":4403,"i":"2078125685135339843","t":"농업은 매우 중요한 안보 전략산업입니다. 만약의 비상사태를 대비해 경제적 효율이 없더라도 반드시 국가 생존을 위한 최소한을 지켜내야 합니다. 이 때문에 각국이 농업보조금을 지급하는데 우리는 여타 선진국에 비해 보조금이 매우 적다는 사실입니다. 이제라도 식량 안보를 지키고 농촌과 농업, 농민을 살리려면 농업보조금을 늘려야 합니다. 효율성 높은 농어촌기본소득이"},{"x":-0.489,"y":0.325,"c":1,"m":"2026-07","d":"2026-07-18","f":4231,"i":"2078428350868316273","t":"최근 경기도에서 발생한 물류창고 화재에 이어 오늘 인천 쿠팡 물류센터에서도 대형 화재가 발생했습니다. 정부는 국가소방동원령을 발령해 가용한 모든 자원을 총동원하며 진화에 전력을 기울이고 있습니다. 불길이 완전히 잡히고 상황이 안정될 때까지 긴장의 끈을 놓지 않고 대응해 나갈 것입니다. 현장에서 밤낮없이 진화에 힘쓰고 계신 소방관 여러분께 깊이 감사드립니다."},{"x":-0.883,"y":0.504,"c":8,"m":"2026-07","d":"2026-07-19","f":7409,"i":"2078683246670602742","t":"돈 때문에 선거에 나갈 수 없다는 건 슬픈 일이기도 하지만, 부정부패의 유인을 키우는 일이기도 합니다. 모두가 인정하는, 그리고 대한민국의 정치를 근본적으로 바꾼 노무현 정치개혁의 핵심중 하나는 돈 안드는 선거 즉 선거공영제 도입이었습니다. 노무현 대통령님의 '돈안드는 선거' 개혁이 없었다면 저도 정치는 꿈도 꾸지 못했을 것입니다. 그래서 제가 민주당 당대"},{"x":-0.876,"y":0.504,"c":8,"m":"2026-07","d":"2026-07-19","f":6237,"i":"2078717850211303737","t":"우선 풀잎이님의 의견과 질책은 감사하게 받아들입니다. 다만, 법이 금한 당무개입이란 성장률 전망을 "},{"x":-1.767,"y":-0.273,"c":8,"m":"2026-09","d":"2026-09-24","f":4841,"i":"2102795469445382627","t":"농지투기 방지와 제대로 된 농지활용을 위해 농지전수조사는 꼭 필요합니다. 경자유전과 이를 지키기 위한 정부의 노력은 헌법 즉 국민의 명령입니다. 저항과 반발 때문에 모든 정부가 회피했지만 저는 회피하지 않겠습니다. 농지투기를 위해 '농사짓겠다고 신고하고 산 농지'를 땅값 상승만을 기다리며 방치하거나 불법임대하는 경우 강제매각시키라는 것이 국민과 국회가 정해"},{"x":1.658,"y":-0.152,"c":3,"m":"2026-09","d":"2026-09-24","f":3746,"i":"2102817256401170599","t":"트럼프 미국 대통령께서 유엔총회에 참석한 각국 수석대표를 위해 마련한 리셉션에 참석했습니다. 세계 각국의 정상과 대표들을 반갑게 만나 다양한 이야기를 나눴습니다. 공식 회담과는 또 다른 편안한 자리에서 격의 없이 대화를 나누며 서로에 대한 이해와 우의를 더욱 깊이 했습니다. 럼 베트남 당서기장님과는 양국 관계 발전과 한반도 평화를, 아누틴 찬위라꾼 태국 총"},{"x":1.183,"y":0.474,"c":3,"m":"2026-09","d":"2026-09-24","f":4382,"i":"2102850364986855564","t":"유엔총회 일정을 마치고 멕시코로 향합니다. 멕시코는 북미와 중남미를 잇는 전략적 요충지이자 대한민국의 중남미 최대 교역·투자 파트너입니다. 대한민국 대통령으로서는 16년 만의 국빈 방문입니다. 이번 방문을 계기로 2005년 수립된 양국의 전략적 동반자 관계를 더욱 발전시키고, 국민과 기업이 체감할 수 있는 실질적인 성과로 이어지도록 지혜를 모으겠습니다. 셰"},{"x":1.037,"y":0.175,"c":6,"m":"2026-09","d":"2026-09-24","f":6393,"i":"2102856096574783937","t":"어제 뉴욕 트럼프 대통령 주최 만찬에서 만난 몽고 흐렐수흐 대통령 내외분. 우리 부부에게 선물한 과하마 망아지는 잘 자라고 있다고 합니다. 이제 멕시코로 출발합니다. 정반대 시차로 정신이 좀 없습니다."},{"x":-1.111,"y":0.424,"c":8,"m":"2026-09","d":"2026-09-24","f":14432,"i":"2103121845297783156","t":"국정은 국가와 국민을 위해 하는 것이지, 정권과 집권자의 이익이나 인기를 위해 해서는 안됩니다. 북한포로 국내송환 문제는 외교, 안보, 한반도 정세에 크게 영향을 미치는 매우 예민한 의제입니다. 남북관계가 어떻게 되든 누군가 죽어나가든 국익이 손상되든 게의치 않고, 성과를 생색내느라 포로 송환사실을 징치고 춤추며 온세상에 광고했을 그들 입장에서는 우리 정부"},{"x":0.572,"y":-0.816,"c":6,"m":"2026-09","d":"2026-09-25","f":4850,"i":"2103211692306190794","t":"멕시코를 지켜낸 영웅들께 경의를 표합니다 16년 만의 멕시코 국빈 방문, 그 첫 일정으로 멕시코시티 차풀테펙 공원 애국영웅탑에 헌화했습니다. 조국을 지키다 스러진 젊은 영웅들의 용기는 지금도 멕시코 국민의 가슴에 살아 있습니다. 그 용기를 기억하며 양국의 우정과 협력을 더 깊이 가꿔 나가겠습니다."},{"x":0.1,"y":-1.575,"c":0,"m":"2026-09","d":"2026-09-25","f":7865,"i":"2103213090393460783","t":"고마운 마음, 따뜻한 한가위 각자의 자리에서 묵묵히 애써주신 국민 여러분께 깊이 감사드립니다. 모두를 고르게 비추는 보름달처럼 국민 여러분의 가정마다 건강과 행복이 가득하시길 바랍니다."},{"x":0.65,"y":1.599,"c":7,"m":"2026-09","d":"2026-09-25","f":3783,"i":"2103289106017219046","t": function col(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
const xs = P.map(p=>p.x), ys = P.map(p=>p.y);
const xmin = Math.min(...xs), xmax = Math.max(...xs), ymin = Math.min(...ys), ymax = Math.max(...ys);
const PADX = 54, PADY = 44;
const sx = x => PADX + (x - xmin) / (xmax - xmin) * (cv.width - PADX*2);
const sy = y => PADY + (1 - (y - ymin) / (ymax - ymin)) * (cv.height - PADY*2);
const visible = p => mIdx >= MONTHS.length || p.m === MONTHS[mIdx];

// 캔버스는 고정 해상도라 화면에서 줄어든 만큼 점·글자를 키워 준다
function scale(){
  const w = cv.getBoundingClientRect().width;
  return w ? cv.width / w : 2;
}
function draw(){
  const S = scale();
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.globalAlpha = .5; ctx.fillStyle = col('--dot');
  P.forEach(p=>{ if (sel.includes(p.c) && visible(p)) return;
    ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), (visible(p) ? 2.6 : 1.7) * S, 0, 6.2832); ctx.fill(); });
  sel.forEach(c=>{ ctx.globalAlpha = .92; ctx.fillStyle = col(HUE(c));
    P.forEach(p=>{ if (p.c !== c || !visible(p)) return;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 3.5 * S, 0, 6.2832); ctx.fill(); }); });
  ctx.globalAlpha = 1;
  if (sel.length > 4) return;   // 라벨이 겹치면 칩이 범례 역할을 한다
  ctx.font = '600 ' + Math.round(13 * S) + 'px "IBM Plex Sans KR", sans-serif';
  ctx.textAlign = 'center';
  sel.forEach(c=>{
    const pts = P.filter(p => p.c === c && visible(p)); if (!pts.length) return;
    const mx = pts.reduce((s,p)=>s+sx(p.x),0)/pts.length, my = pts.reduce((s,p)=>s+sy(p.y),0)/pts.length;
    ctx.lineWidth = 3.5 * S; ctx.strokeStyle = col('--ground');
    ctx.strokeText(NAMES[c], mx, my - 8 * S);
    ctx.fillStyle = col(HUE(c)); ctx.fillText(NAMES[c], mx, my - 8 * S);
  });
}

const chipBox = document.getElementById('chips');
for (let c = 0; c < K; c++){
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed','false');
  b.textContent = NAMES[c];
  b.addEventListener('click', ()=>{
    const at = sel.indexOf(c);
    if (at >= 0) sel.splice(at,1); else sel.push(c);
    sync(); draw();
  });
  chipBox.appendChild(b);
}
function sync(){
  [...chipBox.children].forEach((el,i)=>{
    const on = sel.includes(i);
    el.setAttribute('aria-pressed', String(on));
    el.style.background = on ? col(HUE(i)) : '';
    el.style.borderColor = on ? col(HUE(i)) : '';
    el.style.color = on ? '#fff' : '';
  });
}

const range = document.getElementById('mRange'), mLabel = document.getElementById('mLabel');
range.max = MONTHS.length; range.value = MONTHS.length;
range.addEventListener('input', ()=>{
  mIdx = +range.value;
  mLabel.textContent = mIdx >= MONTHS.length ? '전체 기간' : MONTHS[mIdx];
  draw(); });
document.getElementById('mReset').addEventListener('click', ()=>{
  mIdx = MONTHS.length; range.value = mIdx; mLabel.textContent = '전체 기간'; draw(); });

const tip = document.getElementById('tip');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function nearest(e){
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (cv.width / r.width), my = (e.clientY - r.top) * (cv.height / r.height);
  let best = null, bd = 1e9;
  P.forEach(p=>{ if (!visible(p)) return;
    const dx = sx(p.x) - mx, dy = sy(p.y) - my, d = dx*dx + dy*dy; if (d < bd){ bd = d; best = p; } });
  return bd < 900 ? best : null;
}
cv.addEventListener('mousemove', e=>{
  const b = nearest(e);
  if (!b){ tip.style.opacity = 0; return; }
  tip.innerHTML = '<div class="meta">' + b.d + ' · ' + NAMES[b.c] + ' · 좋아요 ' + b.f.toLocaleString() + '</div>' +
    '<div class="txt">' + esc(b.t || '') + '</div>';
  tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 12) + 'px';
  tip.style.top = Math.max(10, e.clientY - tip.offsetHeight - 12) + 'px';
});
cv.addEventListener('mouseleave', ()=> tip.style.opacity = 0);
cv.addEventListener('click', e=>{
  const b = nearest(e);
  if (b){ tip.style.opacity = 0; openCard(b); }
});

// 부모 페이지에 높이를 알려준다 (반응형 iframe용)
function postHeight(){
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  try { parent.postMessage({ type: 'lee-x-embed:height', height: h }, '*'); } catch (e) {}
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', ()=>{ draw(); postHeight(); });
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ sync(); draw(); });

// ── 점을 누르면 게시물 카드를 먼저 띄운다 ──────────────────────────────
const ovl = document.createElement('div');
ovl.className = 'ovl';
ovl.innerHTML = '<div class="card" role="dialog" aria-modal="true" aria-label="게시물">' +
  '<div class="meta"><span class="sw"></span><span class="when"></span>' +
  '<button class="x" type="button" aria-label="닫기">×</button></div>' +
  '<div class="body"></div>' +
  '<a class="go" target="_blank" rel="noopener">X에서 원문 열기 ↗</a></div>';
document.body.appendChild(ovl);
const ovlBody = ovl.querySelector('.body'), ovlWhen = ovl.querySelector('.when'),
      ovlGo = ovl.querySelector('.go'), ovlSw = ovl.querySelector('.sw');

function closeCard(){ ovl.classList.remove('on'); ovlBody.innerHTML = ''; }
ovl.querySelector('.x').addEventListener('click', closeCard);
ovl.addEventListener('click', e => { if (e.target === ovl) closeCard(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

function openCard(p){
  const url = 'https://x.com/Jaemyung_Lee/status/' + p.i;
  ovlWhen.textContent = p.d + ' · ' + NAMES[p.c] + ' · 좋아요 ' + p.f.toLocaleString();
  ovlSw.style.background = col(HUE(p.c));
  ovlGo.href = url;
  ovl.classList.add('on');
  ovlBody.textContent = p.t || '본문이 없는 게시물입니다. 아래 버튼으로 X에서 확인하세요.';
}

sync(); draw(); postHeight();
</script>
</body>
